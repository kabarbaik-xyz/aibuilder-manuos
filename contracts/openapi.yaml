        '201': { description: Assigned certification record }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Revoke technician certification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: certificationId
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      responses:
        '200': { description: Revoked certification record }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/machines/{id}/downtimes:
    get:
      summary: List machine downtimes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Array of machine downtimes }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Schedule machine downtime
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, startAt, endAt]
              properties:
                reason: { type: string }
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Created machine downtime }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/shifts/templates:
    get:
      summary: List shift templates
      parameters:
        - name: facilityId
          in: query
          schema: { type: string }
      responses:
        '200': { description: Array of shift templates }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create shift template
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, startTime, endTime]
              properties:
                facilityId: { type: string }
                code: { type: string }
                name: { type: string }
                startTime: { type: string, example: "08:00" }
                endTime: { type: string, example: "16:30" }
                breakMinutes: { type: integer, default: 60 }
                isOvernight: { type: boolean, default: false }
      responses:
        '201': { description: Created shift template }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/roster/intervals:
    get:
      summary: List roster intervals
      parameters:
        - name: technicianId
          in: query
          schema: { type: string }
        - name: machineId
          in: query
          schema: { type: string }
        - name: facilityId
          in: query
          schema: { type: string }
        - name: startAt
          in: query
          schema: { type: string, format: date-time }
        - name: endAt
          in: query
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200': { description: Array of roster intervals }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Publish batch of roster intervals
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intervals]
              properties:
                intervals:
                  type: array
                  items:
                    type: object
                    required: [startAt, endAt]
                    properties:
                      facilityId: { type: string }
                      technicianId: { type: string }
                      machineId: { type: string }
                      shiftTemplateId: { type: string }
                      intervalType: { type: string, enum: [SHIFT, OVERTIME, TRAINING, LEAVE, MAINTENANCE, HOLIDAY], default: SHIFT }
                      startAt: { type: string, format: date-time }
                      endAt: { type: string, format: date-time }
                      breakIntervals:
                        type: array
                        items:
                          type: object
                          required: [start, end]
                          properties:
                            start: { type: string }
                            end: { type: string }
                      notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Published roster intervals }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/planning/availability:
    get:
      summary: Query authoritative available working intervals
      parameters:
        - name: resourceType
          in: query
          required: true
          schema: { type: string, enum: [TECHNICIAN, MACHINE] }
        - name: resourceId
          in: query
          required: true
          schema: { type: string }
        - name: startAt
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: endAt
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Continuous working intervals after break, leave, and booking subtraction }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Verify technician eligibility, assessment status, and non-waivable certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [technicianId, slotStart, slotEnd]
              properties:
                technicianId: { type: string }
                minSkillLevels:
                  type: array
                  items:
                    type: object
                    required: [skillId, minLevel]
                    properties:
                      skillId: { type: string }
                      minLevel: { type: integer, minimum: 0, maximum: 4 }
                requiredCertifications:
                  type: array
                  items:
                    type: object
                    required: [certificationId]
                    properties:
                      certificationId: { type: string }
                      scope: { type: string }
                requiredFacilityId: { type: string }
                slotStart: { type: string, format: date-time }
                slotEnd: { type: string, format: date-time }
      responses:
        '200': { description: Eligibility verdict and violation details }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  parameters:
    AccessIdempotency:
      name: idempotency-key
      in: header
      description: Stable key per mutation attempt; replay returns the original result. A different payload with the same key conflicts.
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission or ownership policy denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Malformed or invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AssignTask:
      type: object
      required: [taskId, expectedVersion]
      properties:
        taskId: { type: string, minLength: 1 }
        expectedVersion: { type: integer, minimum: 1 }
        technicianId: { type: string, nullable: true }
        machineId: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        notes: { type: string, maxLength: 500 }
    AccessScope:
      type: object
      required: [roleCodes]
      properties:
        roleCodes:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        customerId: { type: string, nullable: true, description: 'Required for CUSTOMER; only CUSTOMER role may be assigned to a customer-scoped membership.' }
        technicianId: { type: string, nullable: true, description: 'Required for TECHNICIAN; must not already belong to another membership. Mutually exclusive with customer scope.' }
    CreateAccessUser:
      allOf:
        - { $ref: '#/components/schemas/AccessScope' }
        - type: object
          required: [name, email, password]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            email: { type: string, format: email }
            password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    UpdateAccessMembership:
      allOf:
        - { $ref: '#/components/schemas/AccessScope' }
        - type: object
          required: [status, expectedVersion]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            email: { type: string, format: email }
            expectedIdentityUpdatedAt: { type: string, format: date-time, description: 'Required when name or email is supplied; use identityUpdatedAt from the membership read model.' }
            status: { type: string, enum: [ACTIVE, DISABLED] }
            expectedVersion: { type: integer, minimum: 1 }
    CreateAccessRole:
      type: object
      required: [code, name, permissions]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,49}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        permissions:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
    UpdateAccessRole:
      type: object
      required: [name, permissions, isActive, expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        permissions:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        isActive: { type: boolean }
        expectedVersion: { type: integer, minimum: 1 }
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: string
        requestId:
          type: string
        retryable:
          type: boolean
    PrincipalResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [userId, email, name, workspaceId, workspaceName, membershipId, permissions]
          properties:
            userId:
              type: string
            email:
              type: string
            name:
              type: string
            workspaceId:
              type: string
            workspaceName:
              type: string
            membershipId:
              type: string
            permissions:
              type: array
              items:
                type: string
            customerId:
              type: string
              nullable: true
            technicianId:
              type: string
              nullable: true
            roles:
              type: array
              items:
                type: string
    MembershipItem:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          type: string
        roles:
          type: array
          items:
            type: string
        customerId:
          type: string
          nullable: true
        technicianId:
          type: string
          nullable: true
