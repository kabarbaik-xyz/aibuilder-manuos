openapi: 3.0.3
info:
  title: ManuOS API & AI Route Contracts
  description: OpenAPI 3.0 specifications for ManuOS health and server-side Gemini endpoints.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /api/intelligence/capabilities:
    get:
      summary: List AI capabilities visible to the authenticated workspace principal
      description: Uses the current session principal and returns only capability descriptors for which the principal has at least one listed permission. Provider readiness is reported without exposing provider credentials.
      responses:
        '200':
          description: Workspace capability registry
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [workspaceId, evaluatedAt, capabilities]
                    properties:
                      workspaceId: { type: string }
                      evaluatedAt: { type: string, format: date-time }
                      capabilities:
                        type: array
                        items:
                          type: object
                          required: [id, code, title, summary, category, href, contextualEntryLabel, state, availablePage, engineConfigured, statusLabel, unavailableReason, prerequisite]
                          properties:
                            id: { type: string, enum: [AII-01, AII-02, AII-03, AII-04, AII-05, AII-06, AII-07, SCH-07, SCH-08, SCH-09, CST-03, BLD-01] }
                            code: { type: string }
                            title: { type: string }
                            summary: { type: string }
                            category: { type: string, enum: [ASSISTANT, ENGINEERING, PLANNING, RECOVERY, COSTING, QUALITY] }
                            href: { type: string, nullable: true }
                            contextualEntryLabel: { type: string }
                            state: { type: string, enum: [AVAILABLE, DETERMINISTIC_READY, NOT_CONNECTED, UNCONFIGURED_PROVIDER, PILOT_GATED] }
                            availablePage: { type: boolean }
                            engineConfigured: { type: boolean }
                            statusLabel: { type: string }
                            unavailableReason: { type: string, nullable: true }
                            prerequisite: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/intelligence/promise:
    post:
      summary: Evaluate a requested delivery date against a selected released job
      description: Runs the same deterministic finite-capacity dry-run as Planning for the selected order and active workflow instance. A candidate date is returned only when every open task is scheduled and facility timezone is available. It never commits a customer promise or mutates bookings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, instanceId, requestedQuantity, requestedDate]
              properties:
                orderId: { type: string, format: uuid }
                instanceId: { type: string, format: uuid }
                requestedQuantity: { type: string, pattern: '^\d+(\.\d+)?$', description: Positive decimal display quantity using the linked order-line UOM precision. Only the exact full selected manufacturing-order quantity is currently schedulable; partial quantities return NOT_CONNECTED. }
                requestedDate:
                  oneOf:
                    - { type: string, format: date }
                    - { type: string, format: date-time }
              additionalProperties: false
      responses:
        '200':
          description: Date comparison based on complete schedule evidence, or explicit NOT_CONNECTED with missing inputs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [state, evaluationId, inputHash, evaluatedAt, orderId, instanceId, requestedQuantity, requestedQuantityAtoms, quantityUom, requestedDate, feasibleDate, projectedEndAt, isFeasibleOnRequestedDate, deltaDays, scheduleState, bottleneckReason, missingInputs, assumptions, componentReadiness, evidence]
                    properties:
                      state: { type: string, enum: [EVALUATED, NOT_CONNECTED] }
                      evaluationId: { type: string, format: uuid }
                      inputHash: { type: string }
                      evaluatedAt: { type: string, format: date-time }
                      orderId: { type: string, format: uuid }
                      instanceId: { type: string, format: uuid }
                      requestedQuantity: { type: string }
                      requestedQuantityAtoms: { type: string, pattern: '^\d+$' }
                      quantityUom: { type: string, nullable: true }
                      requestedDate: { type: string, format: date }
                      feasibleDate: { type: string, format: date, nullable: true }
                      projectedEndAt: { type: string, format: date-time, nullable: true }
                      isFeasibleOnRequestedDate: { type: boolean, nullable: true }
                      deltaDays: { type: integer, nullable: true }
                      scheduleState: { type: string, enum: [COMPLETE, PARTIAL, NO_FEASIBLE_TASKS, NO_OPEN_TASKS], nullable: true }
                      bottleneckReason: { type: string }
                      missingInputs: { type: array, items: { type: string } }
                      assumptions: { type: array, items: { type: string } }
                      componentReadiness:
                        type: array
                        items:
                          type: object
                          required: [itemId, itemCode, itemName, quantityUom, requiredAtoms, issuedAtoms, reservedAtoms, availableRawAtoms, state, allocatedSupply, confirmedSupply]
                          properties:
                            itemId: { type: string, format: uuid }
                            itemCode: { type: string }
                            itemName: { type: string }
                            quantityUom: { type: string }
                            requiredAtoms: { type: string, pattern: '^\d+$' }
                            issuedAtoms: { type: string, pattern: '^\d+$' }
                            reservedAtoms: { type: string, pattern: '^\d+$' }
                            availableRawAtoms: { type: string, pattern: '^\d+$', description: Workspace-wide unreserved RAW balance snapshot; not allocated to this job and not used to establish feasibility. }
                            state: { type: string, enum: [ISSUED, RESERVED, UNALLOCATED] }
                            allocatedSupply:
                              type: array
                              description: PO line commitments linked to this job's exact material demands; inbound ETA is not ready stock.
                              items:
                                type: object
                                required: [supplyOrderLineId, supplyOrderId, supplyOrderNumber, supplierName, expectedDate, allocatedOutstandingAtoms, receivedAtoms, activelyReservedAtoms]
                                properties:
                                  supplyOrderLineId: { type: string, format: uuid }
                                  supplyOrderId: { type: string, format: uuid }
                                  supplyOrderNumber: { type: string }
                                  supplierName: { type: string }
                                  expectedDate: { type: string, format: date-time }
                                  allocatedOutstandingAtoms: { type: string, pattern: '^\\d+$', description: Allocated inbound quantity not yet received. }
                                  receivedAtoms: { type: string, pattern: '^\\d+$' }
                                  activelyReservedAtoms: { type: string, pattern: '^\\d+$', description: Receipt quantity currently backed by an active stock reservation. }
                            confirmedSupply:
                              description: Approved PO quantity not allocated to this job.
                              type: array
                              items:
                                type: object
                                required: [supplyOrderId, supplyOrderNumber, supplierName, expectedDate, remainingAtoms]
                                properties:
                                  supplyOrderId: { type: string, format: uuid }
                                  supplyOrderNumber: { type: string }
                                  supplierName: { type: string }
                                  expectedDate: { type: string, format: date-time }
                                  remainingAtoms: { type: string, pattern: '^\d+$' }
                      evidence:
                        type: object
                        nullable: true
                        required: [facilityId, facilityTimezone, workflowVersionId, engineeringRevisionId, taskVersions]
                        properties:
                          facilityId: { type: string, format: uuid, nullable: true }
                          facilityTimezone: { type: string, nullable: true }
                          workflowVersionId: { type: string, format: uuid }
                          engineeringRevisionId: { type: string, format: uuid }
                          taskVersions:
                            type: array
                            items:
                              type: object
                              required: [taskId, version]
                              properties:
                                taskId: { type: string, format: uuid }
                                version: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/intelligence/dashboard:
    get:
      summary: Read the authenticated workspace dashboard overview
      description: Returns workspace-scoped metrics, up to 50 most recently created orders, and derived dashboard exceptions. Order exceptions are limited to those orders; material shortage exceptions are derived from all open material demands. This is not a paginated risk inbox.
      responses:
        '200':
          description: Dashboard overview envelope
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [workspaceId, metrics, orders, exceptions, updatedAt]
                    properties:
                      workspaceId: { type: string }
                      metrics: { type: object }
                      orders: { type: array, items: { type: object } }
                      exceptions:
                        type: array
                        items:
                          type: object
                          required: [id, type, title, description, severity, referenceId, actionScreen]
                          properties:
                            id: { type: string }
                            type: { type: string, enum: [MATERIAL_SHORTAGE, PENDING_APPROVAL, QC_REWORK, AT_RISK_ETA] }
                            title: { type: string }
                            description: { type: string }
                            severity: { type: string, enum: [CRITICAL, WARNING, INFO] }
                            referenceId: { type: string }
                            actionScreen: { type: string }
                      updatedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/intelligence/risks:
    get:
      summary: Search and paginate derived workspace dashboard exceptions
      description: Applies authenticated workspace/customer scope. Customer principals see only their order-derived risks; internal material-shortage risks are excluded. Order-derived coverage is limited to the 50 most recently created orders; material shortages use the open-demand set. Pagination is over the currently derived exception set and does not imply full order coverage.
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: type, in: query, schema: { type: string, enum: [MATERIAL_SHORTAGE, PENDING_APPROVAL, QC_REWORK, AT_RISK_ETA] } }
        - { name: severity, in: query, schema: { type: string, enum: [CRITICAL, WARNING, INFO] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 10 } }
      responses:
        '200':
          description: Derived exception page and explicit source coverage
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items, pagination, coverage, updatedAt]
                    properties:
                      items: { type: array, items: { type: object } }
                      pagination:
                        type: object
                        required: [page, pageSize, total, totalPages]
                        properties:
                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer }
                          totalPages: { type: integer }
                      coverage:
                        type: object
                        required: [complete, orderDerivedLimit, note]
                        properties:
                          complete: { type: boolean, enum: [false] }
                          orderDerivedLimit: { type: integer, enum: [50] }
                          note: { type: string }
                      updatedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/intelligence/risks/{id}:
    get:
      summary: Resolve a derived dashboard exception, cause, affected records, evidence, and permitted actions
      description: Customer principals cannot resolve internal material-shortage risks. Detail evidence is freshly resolved inside the current workspace scope; missing evidence is returned explicitly, and the derived exception has no acknowledge or resolve mutation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Current derived exception with cause, observed time, related order/task/material demand, evidence values, missing data, permitted action links, and coverage note }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/intelligence/recovery:
    get:
      summary: List saved recovery proposals for the authenticated workspace
      description: Requires planning.read or order.read. Returns a bounded page of persisted simulations; applying a proposal remains a separate gated operation.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [PROPOSED, REJECTED, APPROVED, SUPERSEDED] } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200': { description: Paginated saved proposal summaries with source order and parsed simulation data }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/intelligence/recovery/propose:
    post:
      summary: Save a finite-capacity schedule review for disruption recovery
      description: Runs the same schedule proposal service used by Planning. Only COMPLETE proposals are saved, through an idempotent audited command that rechecks order and task versions. It persists complete alternate-machine schedules that pass a full capacity simulation and complete overtime scenarios that stay within workspace daily and weekly limits. The requester's active direct supervisor is captured for the baseline and machine alternatives; each overtime scenario is routed to the affected technician's active direct supervisor, who must approve that option. People & Access must have the relevant reporting line configured. Schedule machine-cost estimates use configured integer minor-unit hourly rates; unknown rates produce PARTIAL or NOT_AVAILABLE rather than zero. Partial schedule results return NOT_CONNECTED without persistence. The saved resource IDs are the reviewed assignment inputs for the separate transactional apply command.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderId, instanceId]
              properties:
                orderId: { type: string, format: uuid }
                instanceId: { type: string, format: uuid }
      responses:
        '200': { description: Persisted schedule review with evidence, complete alternate-machine and supervisor-approved overtime options, or NOT_CONNECTED with unscheduled reasons and no persistence }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Order or task version changed while saving; re-evaluate before retrying }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/intelligence/recovery/{id}:
    get:
      summary: Read a saved recovery proposal and its authorized source order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Proposal lifecycle state, source order, and simulation snapshot }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/intelligence/recovery/{id}/reject:
    post:
      summary: Record an audited rejection of a saved recovery proposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { description: Audited rejection command result }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/intelligence/recovery/{id}/request-date:
    post:
      summary: Submit a revalidated recovery projected date for order-change approval
      description: Recomputes the schedule, checks the saved order/workflow/engineering/task versions and facility-local date, then creates an audited DATE change request. It does not publish resource bookings or change the order date. Repeated requests with the same idempotency key replay the same result.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      responses:
        '201': { description: Submitted order change request pending authorized review }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Current schedule, order, task or projected local date differs from the saved proposal; regenerate before requesting review }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/intelligence/recovery/{id}/apply:
    post:
      summary: Approve and apply a reviewed finite-capacity recovery schedule
      description: For the baseline and machine-alternative schedule, only the direct supervisor membership captured when the proposal was submitted may approve. The optional optionId selects a saved complete alternate-machine or overtime schedule; an overtime option may only be approved by the affected technician's current direct supervisor. Overtime intervals are published atomically with the reviewed schedule. Omit optionId to apply a complete baseline schedule. In one audited idempotent transaction, rechecks the saved order, facility, active job, workflow and engineering revision, task versions/status, dependencies, issued or fully reserved material, qualifications and published resource availability. It claims the open proposal with a conditional PROPOSED-to-APPLYING update before writing assignments, confirmed bookings, workflow events and (for overtime options) the published overtime interval, then resolves it. Any stale or infeasible task aborts the whole transaction, including the claim and overtime interval. Historical simulation proposals and old snapshots without resource IDs cannot be applied.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                optionId: { type: string, minLength: 1, description: Saved complete alternate-machine or overtime schedule option. Omit to approve a complete baseline schedule. }
      responses:
        '200': { description: Proposal status, applied task IDs and selected option }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Saved evidence is stale or the assignment is no longer feasible; no task or booking is applied }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/intelligence/recovery/policy:
    get:
      summary: Read the workspace recovery batch policy
      responses:
        '200': { description: Workspace revision and maximum batch quantity as an integer atom string; zero means no split }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Configure maximum quantity in one recovery subcontract batch
      description: Workspace administrators set the ceiling in integer atoms. The server splits the task target into batches and preserves the exact total; zero keeps one batch.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, recoveryBatchAtoms]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                recoveryBatchAtoms: { type: string, pattern: '^\\d+$', description: Integer quantity atoms; 0 disables batch splitting }
      responses:
        '200': { description: Audited workspace policy update }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Workspace policy revision changed; reload before retrying }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/intelligence/recovery/subcontracts/options:
    get:
      summary: List eligible internal operations and active subcontract vendors
      description: Lists READY, unassigned operations with positive target quantity and no open subcontract plan, plus active workspace suppliers.
      responses:
        '200': { description: Workspace-scoped task and supplier choices, with batch policy in integer atoms }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/intelligence/recovery/subcontracts:
    get:
      summary: List subcontract recovery plans and batch status
      responses:
        '200': { description: Scoped subcontract plans with supplier, order, operation and integer-atom batch status }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Request supervisor approval for subcontracting a ready operation
      description: Captures the requester's direct supervisor, operation and order versions, active supplier, and task target quantity. Splits exact target atoms at the configured workspace limit; does not block the task or change its schedule before supervisor approval.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [taskId, supplierId]
              properties:
                taskId: { type: string, format: uuid }
                supplierId: { type: string, format: uuid }
                notes: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Saved supervisor-routed subcontract plan and conserved batches }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Operation already has an open plan or changed while saving }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/intelligence/recovery/subcontracts/{id}/approve:
    post:
      summary: Approve and send the subcontract plan to its vendor
      description: Only the captured active direct supervisor may approve. Rechecks order and task versions; only then moves the operation from READY to BLOCKED and each vendor batch to SENT in one audit transaction.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      responses:
        '200': { description: Approved plan with batches sent to vendor }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Order or task evidence is stale; no task or vendor batch is changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/intelligence/recovery/subcontracts/{id}/reject:
    post:
      summary: Reject a pending subcontract plan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { description: Audited rejection; operation remains in its prior internal state }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/intelligence/recovery/subcontracts/{id}/batches/{batchId}/status:
    post:
      summary: Record that a vendor subcontract batch is in progress
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [IN_PROGRESS] }
                vendorReference: { type: string, maxLength: 120 }
      responses:
        '200': { description: Updated vendor batch status and reference }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/intelligence/recovery/subcontracts/{id}/batches/{batchId}/return:
    post:
      summary: Record returned vendor quantity for a subcontract batch
      description: Returned atoms cannot exceed the unreturned batch quantity. The operation re-enters internal READY only when every subcontract batch has returned the exact planned target; this records no production output, inventory movement, or QC disposition.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [returnedAtoms]
              properties:
                returnedAtoms: { type: string, pattern: '^\\d+$', description: Positive quantity atoms being received }
                vendorReference: { type: string, maxLength: 120 }
      responses:
        '200': { description: Recorded quantity and batch/plan status; final return resumes internal work }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Concurrent state change prevented applying the return }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/intelligence/memory:
    get:
      summary: Read measured task duration and finalized QC evidence for an authorized cohort
      description: Missing measured or planned duration remains null and is excluded from duration statistics. QC quantities serialize as integer atom strings. Cohorts can be bounded by item, department, process, workflow version, facility, and inclusive completion dates. Statistics are calculated across the selected completed-task cohort before evidence-run pagination. To bound work and response memory, cohorts are limited to 5,000 completed tasks and 25,000 combined work-session/output/inspection records; larger cohorts return 400 and require narrower filters. Three measured runs is a provisional display threshold, not a validated buffer recommendation.
      parameters:
        - { name: itemId, in: query, schema: { type: string, maxLength: 100 } }
        - { name: departmentId, in: query, schema: { type: string, maxLength: 100 } }
        - { name: nodeKey, in: query, schema: { type: string, maxLength: 100 } }
        - { name: workflowVersionId, in: query, schema: { type: string, maxLength: 100 } }
        - { name: facilityId, in: query, schema: { type: string, maxLength: 100 } }
        - { name: completedFrom, in: query, description: Inclusive completion date in YYYY-MM-DD format, schema: { type: string, format: date } }
        - { name: completedTo, in: query, description: Inclusive completion date in YYYY-MM-DD format, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 10 } }
      responses:
        '200': { description: Measured cohort summary and paginated evidence runs; unavailable values are nullable }
        '400': { description: Invalid filters or cohort/evidence limits exceeded; add or tighten filters }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/lists/{resource}:
    get:
      summary: Read an authorized database page for a workspace list
      description: Applies workspace/customer scope and filters before COUNT and LIMIT/OFFSET in a SQLite transaction. Stable ordering includes an ID tie-breaker. Out-of-range pages clamp to the last page. Existing collection endpoints remain available for resource selectors and existing integrations.
      parameters:
        - in: path
          name: resource
          required: true
          schema:
            type: string
            enum: [customers, suppliers, items, locations, uoms, departments, calendars, machines, technicians, skills, order-types, qc-checklists, orders, engineering, supply-orders, receipts, inspections, shipments, stock-balances, stock-movements, stock-counts, users, roles, permissions, planning, workflows, forms, portal-orders, my-work]
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, enum: [10, 25, 50, 100], default: 10 }
        - in: query
          name: search
          description: Resource-specific text search, applied in the database on searchable lists.
          schema: { type: string, maxLength: 200 }
        - in: query
          name: status
          description: Order, supply order, inspection or shipment status.
          schema: { type: string }
        - in: query
          name: type
          description: Item type or location kind.
          schema: { type: string }
        - in: query
          name: locationSearch
          description: Location code or name for inventory balance lists.
          schema: { type: string }
        - in: query
          name: purpose
          description: Form template purpose filter.
          schema: { type: string, enum: [ALL, ORDER_SPEC, TASK_EVIDENCE, QC_EVIDENCE] }
        - in: query
          name: movementType
          description: Stock ledger movement type filter.
          schema: { type: string }
      responses:
        '200':
          description: A bounded page with the total filtered record count. Atom quantities serialize as decimal integer strings. Planning also returns full-graph summary metadata; its visible task IDs are selected with database pagination.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { type: object }
                  pagination:
                    type: object
                    required: [page, pageSize, total, totalPages]
                    properties:
                      page: { type: integer, minimum: 1 }
                      pageSize: { type: integer, enum: [10, 25, 50, 100] }
                      total: { type: integer, minimum: 0 }
                      totalPages: { type: integer, minimum: 1 }
                  summary: { type: object }
        '400': { description: Invalid pagination parameters }
        '401': { description: Authentication required }
        '403': { description: Missing permission or customer scope }
        '404': { description: Unknown list resource }
  /api/planning/assignments:
    post:
      summary: Assign task resources with an optimistic task version check
      description: Requires task.assign, planning.write or resource.manage. Task status, predecessor completion, qualifications, booking conflicts and expectedVersion are checked inside the command transaction. Resource booking insert/update triggers enforce exclusive intervals in SQLite.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignTask' }
      responses:
        '200': { description: 'Committed assignment and confirmed resource bookings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Task or assigned resource is not in the current workspace' }
        '409': { description: 'Stale task version, conflicting booking or inconsistent legacy booking windows' }

  /api/planning/schedule-proposals:
    post:
      summary: Generate a dry-run finite-capacity schedule proposal
      description: Selects one active workflow instance and derives facility, requirements, BOM material readiness, roster availability, breaks, leave, downtimes and confirmed-booking gaps from server-side evidence. It never accepts a caller calendar and never writes bookings. Tasks requiring unknown requirements, material, qualification, duration or a contiguous resource window are returned UNSCHEDULED with reasons. Machine capacity is conservatively treated as exclusive and tasks are not split across shifts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderId, startHorizon]
              properties:
                orderId: { type: string, format: uuid }
                instanceId: { type: string, format: uuid, description: Required when the order has multiple active jobs }
                startHorizon: { type: string, format: date-time }
                horizonDays: { type: integer, minimum: 1, maximum: 30, default: 14 }
      responses:
        '200':
          description: Dry-run task assignments and explicit unscheduled reasons, with evidence scope and assumptions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [state, tasks, makespanMinutes, assumptions, scope, evaluatedAt]
                    properties:
                      state: { type: string, enum: [COMPLETE, PARTIAL, NO_FEASIBLE_TASKS, NO_OPEN_TASKS] }
                      makespanMinutes: { type: integer, minimum: 0 }
                      projectedEndAt: { type: string, format: date-time, nullable: true }
                      evaluatedAt: { type: string, format: date-time }
                      assumptions: { type: array, items: { type: string } }
                      scope:
                        type: object
                        required: [orderId, orderNumber, instanceId, workflowVersionId, engineeringRevisionId, facilityId, horizonStart, horizonEnd]
                        properties:
                          orderId: { type: string, format: uuid }
                          orderNumber: { type: string }
                          instanceId: { type: string, format: uuid }
                          workflowVersionId: { type: string, format: uuid }
                          engineeringRevisionId: { type: string, format: uuid }
                          facilityId: { type: string, format: uuid, nullable: true }
                          horizonStart: { type: string, format: date-time }
                          horizonEnd: { type: string, format: date-time }
                      tasks:
                        type: array
                        items:
                          type: object
                          required: [taskId, version, nodeKey, predecessorTaskIds, status, startAt, endAt, technicianId, machineId, reasons]
                          properties:
                            taskId: { type: string, format: uuid }
                            version: { type: integer }
                            nodeKey: { type: string }
                            predecessorTaskIds: { type: array, items: { type: string, format: uuid } }
                            status: { type: string, enum: [SCHEDULED, UNSCHEDULED] }
                            startAt: { type: string, format: date-time, nullable: true }
                            endAt: { type: string, format: date-time, nullable: true }
                            technicianId: { type: string, format: uuid, nullable: true }
                            technicianName: { type: string, nullable: true }
                            machineId: { type: string, format: uuid, nullable: true }
                            machineName: { type: string, nullable: true }
                            reasons: { type: array, items: { type: string } }
        '409': { description: The proposal is stale, its facility scope changed, or another application already resolved it }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/planning/schedule-proposals/apply:
    post:
      summary: Apply the exact reviewed finite-capacity schedule proposal
      description: Recomputes the proposal inside one audited idempotent transaction and compares its scope, order/task versions, time windows and resource assignments with the reviewed snapshot. It then revalidates open-task status, dependencies, issued or reserved materials, qualifications and current availability before assigning tasks, creating confirmed bookings and appending workflow events. Any stale or infeasible task aborts the complete transaction. This applies task assignments; publishing a versioned schedule snapshot remains a separate action.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderId, instanceId, startHorizon, horizonDays, expected]
              properties:
                orderId: { type: string, format: uuid }
                instanceId: { type: string, format: uuid }
                startHorizon: { type: string, format: date-time }
                horizonDays: { type: integer, minimum: 1, maximum: 30 }
                expected:
                  type: object
                  additionalProperties: false
                  required: [orderVersion, workflowVersionId, engineeringRevisionId, tasks]
                  properties:
                    orderVersion: { type: integer, minimum: 1 }
                    workflowVersionId: { type: string, format: uuid }
                    engineeringRevisionId: { type: string, format: uuid }
                    tasks:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: object
                        additionalProperties: false
                        required: [taskId, version, status, startAt, endAt, technicianId, machineId]
                        properties:
                          taskId: { type: string, format: uuid }
                          version: { type: integer, minimum: 1 }
                          status: { type: string, enum: [SCHEDULED] }
                          startAt: { type: string, format: date-time }
                          endAt: { type: string, format: date-time }
                          technicianId: { type: string, format: uuid, nullable: true }
                          machineId: { type: string, format: uuid, nullable: true }
      responses:
        '200': { description: Applied task IDs and committed resource version }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The reviewed proposal became stale or a required assignment is no longer feasible; all writes are rolled back }
  /api/planning/technician-recommendations:
    post:
      summary: Rank active, qualified technicians for a released task and time window
      description: Task skill and certification requirements are loaded from its released workflow version. Caller-supplied requirements are not accepted. Results are advisory; the assignment command revalidates permission, qualification, roster availability, existing bookings and task version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, slotStart, slotEnd]
              properties:
                taskId: { type: string, minLength: 1, maxLength: 100 }
                slotStart: { type: string, format: date-time }
                slotEnd: { type: string, format: date-time }
      responses:
        '200': { description: Ranked candidates with eligibility violations and workload rationale }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

