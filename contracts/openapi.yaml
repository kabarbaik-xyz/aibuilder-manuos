openapi: 3.0.3
info:
  title: ManuOS API & AI Route Contracts
  description: OpenAPI 3.0 specifications for ManuOS health and server-side Gemini endpoints.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /api/lists/{resource}:
    get:
      summary: Read an authorized database page for a workspace list
      description: Applies workspace/customer scope and filters before COUNT and LIMIT/OFFSET in a SQLite transaction. Stable ordering includes an ID tie-breaker. Out-of-range pages clamp to the last page. Existing collection endpoints remain available for resource selectors and existing integrations.
      parameters:
        - in: path
          name: resource
          required: true
          schema:
            type: string
            enum: [customers, suppliers, items, locations, uoms, departments, calendars, machines, technicians, skills, order-types, qc-checklists, orders, engineering, supply-orders, receipts, inspections, shipments, stock-balances, stock-movements, stock-counts, users, roles, permissions, planning, workflows, forms, portal-orders, my-work]
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, enum: [10, 25, 50, 100], default: 10 }
        - in: query
          name: search
          description: Resource-specific text search, applied in the database on searchable lists.
          schema: { type: string, maxLength: 200 }
        - in: query
          name: status
          description: Order, supply order, inspection or shipment status.
          schema: { type: string }
        - in: query
          name: type
          description: Item type or location kind.
          schema: { type: string }
        - in: query
          name: locationSearch
          description: Location code or name for inventory balance lists.
          schema: { type: string }
        - in: query
          name: purpose
          description: Form template purpose filter.
          schema: { type: string, enum: [ALL, ORDER_SPEC, TASK_EVIDENCE, QC_EVIDENCE] }
        - in: query
          name: movementType
          description: Stock ledger movement type filter.
          schema: { type: string }
      responses:
        '200':
          description: A bounded page with the total filtered record count. Atom quantities serialize as decimal integer strings. Planning also returns full-graph summary metadata; its visible task IDs are selected with database pagination.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { type: object }
                  pagination:
                    type: object
                    required: [page, pageSize, total, totalPages]
                    properties:
                      page: { type: integer, minimum: 1 }
                      pageSize: { type: integer, enum: [10, 25, 50, 100] }
                      total: { type: integer, minimum: 0 }
                      totalPages: { type: integer, minimum: 1 }
                  summary: { type: object }
        '400': { description: Invalid pagination parameters }
        '401': { description: Authentication required }
        '403': { description: Missing permission or customer scope }
        '404': { description: Unknown list resource }
  /api/health:
    get:
      summary: Health check endpoint
      description: Returns service status without authentication or external API calls.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    example: '2026-11-24T09:00:00Z'

  /api/ai/explain-impact:
    post:
      summary: Explain disruption impact and blast radius
      description: Generates an AI explanation strictly grounded in deterministic ripple and CPM data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disruption, affectedOrders, blockedTasks, runnableTasks]
              properties:
                disruption:
                  type: object
                affectedOrders:
                  type: array
                  items:
                    type: object
                blockedTasks:
                  type: array
                  items:
                    type: object
                runnableTasks:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Grounded impact analysis narrative
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      summary:
                        type: string
                      cause:
                        type: string
                      blastRadius:
                        type: array
                        items:
                          type: string
                      watchItems:
                        type: array
                        items:
                          type: string
                  reason:
                    type: string
                    nullable: true

  /api/ai/recovery-options:
    post:
      summary: Generate and narrate recovery candidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disruption, constraints, capacity]
              properties:
                disruption:
                  type: object
                constraints:
                  type: object
                capacity:
                  type: object
      responses:
        '200':
          description: Recovery options narrative
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      options:
                        type: array
                        items:
                          type: object
                  reason:
                    type: string
                    nullable: true

  /api/ai/memory-recommend:
    post:
      summary: Provide historical planning recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, stats]
              properties:
                query:
                  type: object
                stats:
                  type: object
      responses:
        '200':
          description: Grounded memory recommendation
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      recommendation:
                        type: string
                      rationale:
                        type: string
                      suggestedPaddingPct:
                        type: number
                  reason:
                    type: string
                    nullable: true

  /api/ai/dispatch-rationale:
    post:
      summary: Generate technician ranking comparison rationale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task, rankedCandidates]
              properties:
                task:
                  type: object
                rankedCandidates:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Rationale explanation
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      rationale:
                        type: string
                      gapFlag:
                        type: boolean
                  reason:
                    type: string
                    nullable: true

  /api/ai/partner-fit:
    post:
      summary: Explain partner ecosystem fit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requirement, partnerMatches]
              properties:
                requirement:
                  type: object
                partnerMatches:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Partner fit narrative
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      narrative:
                        type: string
                      riskNotes:
                        type: array
                        items:
                          type: string
                  reason:
                    type: string
                    nullable: true

  /api/ai/brain-qa:
    post:
      summary: Read-only factory operational brain Q&A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, snapshot]
              properties:
                question:
                  type: string
                snapshot:
                  type: object
      responses:
        '200':
          description: Grounded response with evidence links
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      answer:
                        type: string
                      evidenceRefs:
                        type: array
                        items:
                          type: string
                      linkToScreen:
                        type: string
                  reason:
                    type: string
                    nullable: true

  /api/ai/extract-rfq:
    post:
      summary: Extract engineering requirements from customer RFQ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rfqText]
              properties:
                rfqText:
                  type: string
      responses:
        '200':
          description: Extracted structured RFQ
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      customer:
                        type: string
                      partName:
                        type: string
                      qty:
                        type: integer
                      material:
                        type: string
                      tolerances:
                        type: array
                        items:
                          type: string
                      ambiguities:
                        type: array
                        items:
                          type: string
                      draftBOM:
                        type: array
                        items:
                          type: object
                      draftRouting:
                        type: array
                        items:
                          type: object
                      qcChecklist:
                        type: array
                        items:
                          type: string
                  reason:
                    type: string
                    nullable: true

  /api/ai/generate-workflow:
    post:
      summary: Propose dynamic workflow DAG configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderTypeName, description]
              properties:
                orderTypeName:
                  type: string
                description:
                  type: string
                companyProfile:
                  type: object
      responses:
        '200':
          description: Proposed DAG
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                      edges:
                        type: array
                        items:
                          type: object
                      transitionRules:
                        type: array
                        items:
                          type: string
                      warnings:
                        type: array
                        items:
                          type: string
                  reason:
                    type: string
                    nullable: true

  /api/ai/promise-explain:
    post:
      summary: Explain feasible delivery date drivers and alternatives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request, feasibilityResult]
              properties:
                request:
                  type: object
                feasibilityResult:
                  type: object
      responses:
        '200':
          description: Feasible promise narrative
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      summary:
                        type: string
                      bottleneckExplanation:
                        type: string
                      alternativesNarrative:
                        type: string
                  reason:
                    type: string
                    nullable: true

  /api/me:
    get:
      summary: Get current authenticated principal and membership
      description: Returns the authenticated user profile, active workspace, granted permissions, and linked customer/technician scope.
      responses:
        '200':
          description: Active principal identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users:
    get:
      summary: List safe membership read models in the current workspace
      description: Requires access.manage. Includes membership version, roles and scope; never credentials.
      responses:
        '200': { description: 'Envelope containing data array of memberships, identityUpdatedAt and canEditIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a new credential account and workspace membership atomically
      description: Requires access.manage. Existing emails return 409 and never reset credentials. Idempotency and audit apply.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccessUser' }
      responses:
        '201': { description: 'Committed envelope with data.userId, data.membershipId, data.name, data.email and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Duplicate email or idempotency payload conflict' }
  /api/users/{id}:
    parameters:
      - { name: id, in: path, required: true, description: Workspace membership ID, schema: { type: string } }
    get:
      summary: Read a workspace membership
      description: Requires access.manage.
      responses:
        '200': { description: 'Envelope containing data membership' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Membership not in current workspace' }
    patch:
      summary: Replace membership role assignments, scope and status
      description: Requires access.manage. Optionally edits name/login email when the actor administers every linked workspace. Passwords are unchanged; changing email revokes target sessions and resets email verification. At least one active ACCESS_ADMIN must remain. Grants affect subsequent requests.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccessMembership' }
      responses:
        '200': { description: 'Committed envelope with data.id, data.status, data.name, data.email, data.reauthenticate and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Membership not in current workspace' }
        '409': { description: 'Stale expectedVersion or idempotency conflict; transaction rolled back' }
  /api/roles:
    get:
      summary: List active and inactive workspace roles
      description: Requires access.manage. Each row includes id, code, name, isSystem, isActive, version, memberCount and permission codes.
      responses:
        '200': { description: 'Envelope containing data array of roles' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a custom workspace role
      description: Requires access.manage. Permission codes must exist in the application catalog.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccessRole' }
      responses:
        '201': { description: 'Committed envelope with data.id and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Duplicate workspace role code or idempotency conflict' }
  /api/roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update a custom role name, permissions and active status
      description: Requires access.manage. System role definitions are immutable. Inactive roles confer no permissions. No destructive delete.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccessRole' }
      responses:
        '200': { description: 'Committed envelope with data.id and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Role not in current workspace' }
        '409': { description: 'Stale expectedVersion or idempotency conflict' }
  /api/permissions:
    get:
      summary: Read the application permission catalog
      description: Requires access.manage. Permission definitions are read-only and are maintained with application behavior.
      responses:
        '200': { description: 'Envelope containing data array with code, description, resource and action' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/access/scopes:
    get:
      summary: Read customer and technician link options for access administration
      description: Requires access.manage. Returns only current workspace options. Assignments validate scope and technician uniqueness.
      responses:
        '200': { description: 'Envelope containing data.customers and data.technicians with id, code and name' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    AccessIdempotency:
      name: idempotency-key
      in: header
      description: Stable key per mutation attempt; replay returns the original result. A different payload with the same key conflicts.
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission or ownership policy denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Malformed or invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AccessScope:
      type: object
      required: [roleCodes]
      properties:
        roleCodes:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        customerId: { type: string, nullable: true, description: 'Required for CUSTOMER; only CUSTOMER role may be assigned to a customer-scoped membership.' }
        technicianId: { type: string, nullable: true, description: 'Required for TECHNICIAN; must not already belong to another membership. Mutually exclusive with customer scope.' }
    CreateAccessUser:
      allOf:
        - { $ref: '#/components/schemas/AccessScope' }
        - type: object
          required: [name, email, password]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            email: { type: string, format: email }
            password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    UpdateAccessMembership:
      allOf:
        - { $ref: '#/components/schemas/AccessScope' }
        - type: object
          required: [status, expectedVersion]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            email: { type: string, format: email }
            expectedIdentityUpdatedAt: { type: string, format: date-time, description: 'Required when name or email is supplied; use identityUpdatedAt from the membership read model.' }
            status: { type: string, enum: [ACTIVE, DISABLED] }
            expectedVersion: { type: integer, minimum: 1 }
    CreateAccessRole:
      type: object
      required: [code, name, permissions]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,49}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        permissions:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
    UpdateAccessRole:
      type: object
      required: [name, permissions, isActive, expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        permissions:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        isActive: { type: boolean }
        expectedVersion: { type: integer, minimum: 1 }
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: string
        requestId:
          type: string
        retryable:
          type: boolean
    PrincipalResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [userId, email, name, workspaceId, workspaceName, membershipId, permissions]
          properties:
            userId:
              type: string
            email:
              type: string
            name:
              type: string
            workspaceId:
              type: string
            workspaceName:
              type: string
            membershipId:
              type: string
            permissions:
              type: array
              items:
                type: string
            customerId:
              type: string
              nullable: true
            technicianId:
              type: string
              nullable: true
            roles:
              type: array
              items:
                type: string
    MembershipItem:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          type: string
        roles:
          type: array
          items:
            type: string
        customerId:
          type: string
          nullable: true
        technicianId:
          type: string
          nullable: true
