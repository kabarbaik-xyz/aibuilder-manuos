  /api/inventory/movement-options:
    get:
      summary: Named material requirements and source stock for movement forms
      description: Requires inventory.read plus inventory.issue for issue/return or inventory.transfer for transfer. Requirements are scoped to granted order facilities and the current workspace. Stock lots are scoped to workspace, item and source location. Quantities are formatted strings with raw atoms serialized as strings; truncated is explicit at500 requirements or200 buckets.
      parameters:
        - { in: query, name: mode, required: true, schema: { type: string, enum: [issue, return, transfer] } }
        - { in: query, name: itemId, schema: { type: string, format: uuid } }
        - { in: query, name: locationId, schema: { type: string, format: uuid } }
