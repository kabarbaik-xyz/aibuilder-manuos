openapi: 3.0.3
info:
  title: ManuOS API & AI Route Contracts
  description: OpenAPI 3.0 specifications for ManuOS health and server-side Gemini endpoints.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /api/lists/{resource}:
    get:
      summary: Read an authorized database page for a workspace list
      description: Applies workspace/customer scope and filters before COUNT and LIMIT/OFFSET in a SQLite transaction. Stable ordering includes an ID tie-breaker. Out-of-range pages clamp to the last page. Existing collection endpoints remain available for resource selectors and existing integrations.
      parameters:
        - in: path
          name: resource
          required: true
          schema:
            type: string
            enum: [customers, suppliers, items, locations, uoms, departments, calendars, machines, technicians, skills, order-types, qc-checklists, orders, engineering, supply-orders, receipts, inspections, shipments, stock-balances, stock-movements, stock-counts, users, roles, permissions, planning, workflows, forms, portal-orders, my-work]
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, enum: [10, 25, 50, 100], default: 10 }
        - in: query
          name: search
          description: Resource-specific text search, applied in the database on searchable lists.
          schema: { type: string, maxLength: 200 }
        - in: query
          name: status
          description: Order, supply order, inspection or shipment status.
          schema: { type: string }
        - in: query
          name: type
          description: Item type or location kind.
          schema: { type: string }
        - in: query
          name: locationSearch
          description: Location code or name for inventory balance lists.
          schema: { type: string }
        - in: query
          name: purpose
          description: Form template purpose filter.
          schema: { type: string, enum: [ALL, ORDER_SPEC, TASK_EVIDENCE, QC_EVIDENCE] }
        - in: query
          name: movementType
          description: Stock ledger movement type filter.
          schema: { type: string }
      responses:
        '200':
          description: A bounded page with the total filtered record count. Atom quantities serialize as decimal integer strings. Planning also returns full-graph summary metadata; its visible task IDs are selected with database pagination.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { type: object }
                  pagination:
                    type: object
                    required: [page, pageSize, total, totalPages]
                    properties:
                      page: { type: integer, minimum: 1 }
                      pageSize: { type: integer, enum: [10, 25, 50, 100] }
                      total: { type: integer, minimum: 0 }
                      totalPages: { type: integer, minimum: 1 }
                  summary: { type: object }
        '400': { description: Invalid pagination parameters }
        '401': { description: Authentication required }
        '403': { description: Missing permission or customer scope }
        '404': { description: Unknown list resource }
  /api/planning/assignments:
    post:
      summary: Assign task resources with an optimistic task version check
      description: Requires task.assign, planning.write or resource.manage. Task status, predecessor completion, qualifications, booking conflicts and expectedVersion are checked inside the command transaction. Resource booking insert/update triggers enforce exclusive intervals in SQLite.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignTask' }
      responses:
        '200': { description: 'Committed assignment and confirmed resource bookings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Task or assigned resource is not in the current workspace' }
        '409': { description: 'Stale task version, conflicting booking or inconsistent legacy booking windows' }

  /api/planning/assignments/{id}/reschedule:
    post:
      summary: Reschedule an existing task assignment
      description: Atomically updates scheduled slot and replaces resource bookings for assigned technician and machine.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledStart, scheduledEnd]
              properties:
                scheduledStart: { type: string, format: date-time }
                scheduledEnd: { type: string, format: date-time }
      responses:
        '200': { description: Rescheduled assignment envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/planning/assignments/{id}/cancel:
    post:
      summary: Cancel an existing task assignment
      description: Atomically releases confirmed bookings to CANCELLED, unassigns resources, and reverts task to READY status.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: Cancelled assignment envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/planning/tasks/{id}/readiness:
    get:
      summary: Evaluate comprehensive dispatch readiness of a task
      description: Evaluates predecessor completion status, material demand availability, and equipment readiness.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Readiness evaluation DTO }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/health:
    get:
      summary: Health check endpoint
      description: Returns service status without authentication or external API calls.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    example: '2026-11-24T09:00:00Z'

  /api/ai/explain-impact:
    post:
      summary: Explain disruption impact and blast radius
      description: Generates an AI explanation strictly grounded in deterministic ripple and CPM data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disruption, affectedOrders, blockedTasks, runnableTasks]
              properties:
                disruption:
                  type: object
                affectedOrders:
                  type: array
                  items:
                    type: object
                blockedTasks:
                  type: array
                  items:
                    type: object
                runnableTasks:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Grounded impact analysis narrative
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      summary:
                        type: string
                      cause:
                        type: string
                      blastRadius:
                        type: array
                        items:
                          type: string
                      watchItems:
                        type: array
                        items:
                          type: string
                  reason:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ai/recovery-options:
    post:
      summary: Generate and narrate recovery candidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disruption, constraints, capacity]
              properties:
                disruption:
                  type: object
                constraints:
                  type: object
                capacity:
                  type: object
      responses:
        '200':
          description: Recovery options narrative
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      options:
                        type: array
                        items:
                          type: object
                  reason:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ai/memory-recommend:
    post:
      summary: Provide historical planning recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, stats]
              properties:
                query:
                  type: object
                stats:
                  type: object
      responses:
        '200':
          description: Grounded memory recommendation
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      recommendation:
                        type: string
                      rationale:
                        type: string
                      suggestedPaddingPct:
                        type: number
                  reason:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ai/dispatch-rationale:
    post:
      summary: Generate technician ranking comparison rationale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task, rankedCandidates]
              properties:
                task:
                  type: object
                rankedCandidates:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Rationale explanation
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      rationale:
                        type: string
                      gapFlag:
                        type: boolean
                  reason:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ai/partner-fit:
    post:
      summary: Explain partner ecosystem fit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requirement, partnerMatches]
              properties:
                requirement:
                  type: object
                partnerMatches:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Partner fit narrative
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      narrative:
                        type: string
                      riskNotes:
                        type: array
                        items:
                          type: string
                  reason:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ai/brain-qa:
    post:
      summary: Read-only factory operational brain Q&A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, snapshot]
              properties:
                question:
                  type: string
                snapshot:
                  type: object
      responses:
        '200':
          description: Grounded response with evidence links
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      answer:
                        type: string
                      evidenceRefs:
                        type: array
                        items:
                          type: string
                      linkToScreen:
                        type: string
                  reason:
                    type: string
                    nullable: true

  /api/ai/extract-rfq:
    post:
      summary: Extract engineering requirements from customer RFQ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rfqText]
              properties:
                rfqText:
                  type: string
      responses:
        '200':
          description: Extracted structured RFQ
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      customer:
                        type: string
                      partName:
                        type: string
                      qty:
                        type: integer
                      material:
                        type: string
                      tolerances:
                        type: array
                        items:
                          type: string
                      ambiguities:
                        type: array
                        items:
                          type: string
                      draftBOM:
                        type: array
                        items:
                          type: object
                      draftRouting:
                        type: array
                        items:
                          type: object
                      qcChecklist:
                        type: array
                        items:
                          type: string
                  reason:
                    type: string
                    nullable: true

  /api/ai/generate-workflow:
    post:
      summary: Propose dynamic workflow DAG configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderTypeName, description]
              properties:
                orderTypeName:
                  type: string
                description:
                  type: string
                companyProfile:
                  type: object
      responses:
        '200':
          description: Proposed DAG
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                      edges:
                        type: array
                        items:
                          type: object
                      transitionRules:
                        type: array
                        items:
                          type: string
                      warnings:
                        type: array
                        items:
                          type: string
                  reason:
                    type: string
                    nullable: true

  /api/ai/promise-explain:
    post:
      summary: Explain feasible delivery date drivers and alternatives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request, feasibilityResult]
              properties:
                request:
                  type: object
                feasibilityResult:
                  type: object
      responses:
        '200':
          description: Feasible promise narrative
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiResult:
                    type: object
                    nullable: true
                    properties:
                      summary:
                        type: string
                      bottleneckExplanation:
                        type: string
                      alternativesNarrative:
                        type: string
                  reason:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/me:
    get:
      summary: Get current authenticated principal and membership
      description: Returns the authenticated user profile, active workspace, granted permissions, and linked customer/technician scope.
      responses:
        '200':
          description: Active principal identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users:
    get:
      summary: List safe membership read models in the current workspace
      description: Requires access.manage. Includes membership version, roles and scope; never credentials.
      responses:
        '200': { description: 'Envelope containing data array of memberships, identityUpdatedAt and canEditIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a new credential account and workspace membership atomically
      description: Requires access.manage. Existing emails return 409 and never reset credentials. Idempotency and audit apply.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccessUser' }
      responses:
        '201': { description: 'Committed envelope with data.userId, data.membershipId, data.name, data.email and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Duplicate email or idempotency payload conflict' }
  /api/users/{id}:
    parameters:
      - { name: id, in: path, required: true, description: Workspace membership ID, schema: { type: string } }
    get:
      summary: Read a workspace membership
      description: Requires access.manage.
      responses:
        '200': { description: 'Envelope containing data membership' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Membership not in current workspace' }
    patch:
      summary: Replace membership role assignments, scope and status
      description: Requires access.manage. Optionally edits name/login email when the actor administers every linked workspace. Passwords are unchanged; changing email revokes target sessions and resets email verification. At least one active ACCESS_ADMIN must remain. Grants affect subsequent requests.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccessMembership' }
      responses:
        '200': { description: 'Committed envelope with data.id, data.status, data.name, data.email, data.reauthenticate and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Membership not in current workspace' }
        '409': { description: 'Stale expectedVersion or idempotency conflict; transaction rolled back' }
  /api/roles:
    get:
      summary: List active and inactive workspace roles
      description: Requires access.manage. Each row includes id, code, name, isSystem, isActive, version, memberCount and permission codes.
      responses:
        '200': { description: 'Envelope containing data array of roles' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a custom workspace role
      description: Requires access.manage. Permission codes must exist in the application catalog.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccessRole' }
      responses:
        '201': { description: 'Committed envelope with data.id and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Duplicate workspace role code or idempotency conflict' }
  /api/roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update a custom role name, permissions and active status
      description: Requires access.manage. System role definitions are immutable. Inactive roles confer no permissions. No destructive delete.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccessRole' }
      responses:
        '200': { description: 'Committed envelope with data.id and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Role not in current workspace' }
        '409': { description: 'Stale expectedVersion or idempotency conflict' }
  /api/permissions:
    get:
      summary: Read the application permission catalog
      description: Requires access.manage. Permission definitions are read-only and are maintained with application behavior.
      responses:
        '200': { description: 'Envelope containing data array with code, description, resource and action' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/access/scopes:
    get:
      summary: Read customer and technician link options for access administration
      description: Requires access.manage. Returns only current workspace options. Assignments validate scope and technician uniqueness.
      responses:
        '200': { description: 'Envelope containing data.customers and data.technicians with id, code and name' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/execution/tasks/{id}/start:
    post:
      summary: Start execution of an assigned task
      description: Validates operator assignment ownership, checks predecessor completion, transitions task to RUNNING, and records work session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                technicianId: { type: string }
                overrideReason: { type: string }
                notes: { type: string }
      responses:
        '200': { description: Task and active session details }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/execution/tasks/{id}/pause:
    post:
      summary: Pause an in-progress execution task
      description: Closes active session, sets status to PAUSED, and records duration.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, default: BREAK }
                notes: { type: string }
      responses:
        '200': { description: Task and paused session details }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/execution/tasks/{id}/resume:
    post:
      summary: Resume a paused execution task
      description: Starts new work session and transitions task back to RUNNING.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        '200': { description: Task and resumed session details }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/delivery/shipments:
    get:
      summary: List workspace-scoped shipment allocations
      description: Requires delivery.read, order.read or owner. Optional filters are applied within the authenticated workspace.
      parameters:
        - in: query
          name: orderId
          schema: { type: string, format: uuid }
        - in: query
          name: customerId
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [ALLOCATED, DISPATCHED, DELIVERED, CANCELLED] }
      responses:
        '200': { description: Shipment list envelope }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Allocate finished goods to an order shipment
      description: Requires delivery.dispatch, order.create or owner. Allocation is revalidated transactionally and capped against each matching order item line; an item not on the order cannot be allocated. Stock reservations and shipment lines are created atomically.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, lines]
              properties:
                orderId: { type: string, format: uuid }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, sourceLocationId, allocatedAtoms]
                    properties:
                      itemId: { type: string, format: uuid }
                      lotId: { type: string, format: uuid }
                      sourceLocationId: { type: string, format: uuid }
                      allocatedAtoms: { type: string, pattern: '^[0-9]+$', description: Positive integer 10^6 atoms }
                carrierName: { type: string, maxLength: 100 }
                trackingNumber: { type: string, maxLength: 100 }
                destinationAddress: { type: string, maxLength: 500 }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Shipment allocation and reservation envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/delivery/shipments/{id}/dispatch:
    post:
      summary: Dispatch an allocated shipment
      description: Posts shipment ledger movements and consumes reservations in one idempotent command.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                carrierName: { type: string, maxLength: 100 }
                trackingNumber: { type: string, maxLength: 100 }
                notes: { type: string, maxLength: 500 }
      responses:
        '200': { description: Dispatched shipment envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/delivery/shipments/{id}/confirm:
    post:
      summary: Confirm proof of delivery
      description: Confirms a dispatched shipment and recalculates the order delivery status from delivered quantities.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proofOfDelivery: { type: string, maxLength: 500 }
                receivedBy: { type: string, maxLength: 100 }
                deliveredAt: { type: string, format: date-time }
                notes: { type: string, maxLength: 500 }
      responses:
        '200': { description: Delivered shipment envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/execution/tasks/{id}/output:
    post:
      summary: Record production output with integer atoms
      description: Authoritatively consumes WIP material demand, caps final output against the matching order item line across the order, records output units, and triggers double-entry stock movement into quarantine/destination location.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outputAtoms, destinationLocationId]
              properties:
                outputAtoms: { type: string, description: Integer 10^6 atoms }
                destinationLocationId: { type: string }
                lotNumber: { type: string }
                serialNumber: { type: string }
                isFinal: { type: boolean }
                notes: { type: string }
      responses:
        '200': { description: Production output and movement envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/execution/tasks/{id}/issues:
    get:
      summary: List all issues recorded for a task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Array of TaskIssueDTO }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Record a blocker or issue on a task
      description: Records issue, notifies assigned owner, and transitions task to BLOCKED if severity is HIGH or CRITICAL.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, severity]
              properties:
                issueReasonId: { type: string }
                title: { type: string }
                description: { type: string }
                severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
                ownerUserId: { type: string }
                expectedResolutionAt: { type: string, format: date-time }
                evidence: { type: array, items: { type: string } }
      responses:
        '200': { description: Created TaskIssueDTO envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/execution/issues/{id}/resolve:
    post:
      summary: Resolve an open task issue
      description: Marks issue RESOLVED and automatically unblocks the parent task if no other blocking issues remain.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes: { type: string }
      responses:
        '200': { description: Resolved TaskIssueDTO envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/execution/issues/{id}/reopen:
    post:
      summary: Reopen a previously resolved task issue
      description: Reopens issue and sets parent task back to BLOCKED if severity is HIGH or CRITICAL.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes: { type: string }
      responses:
        '200': { description: Reopened TaskIssueDTO envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/execution/scan:
    post:
      summary: Lookup task, job, or order by scanned barcode or QR string
      description: |
        Safely parses a barcode/QR token with tenant authorization check.
        Disclosure rules: TASK results are limited to tasks assigned to the
        caller unless the caller holds task.assign/planning.read; ORDER results
        require order.read; JOB results include a deep-link taskId only for
        callers allowed to open tasks (assigned operators and supervisors).
        Callers without any matching entity receive 404 without disclosure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: ScanResultDTO envelope (type TASK|JOB|ORDER, entityId, displayCode, title, status, optional taskId)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/facilities:
    get:
      summary: List all facilities in current workspace
      description: Returns operating sites ordered by default status and code.
      responses:
        '200': { description: Array of facilities }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a new operating facility
      description: Requires resource.manage or workspace.admin. Code must be unique within workspace.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                timezone: { type: string, default: Asia/Jakarta }
                address: { type: string }
                isDefault: { type: boolean, default: false }
      responses:
        '201': { description: Created facility }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/facilities/{id}:
    get:
      summary: Get facility details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Facility details }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Facility not found }
    patch:
      summary: Update facility configuration
      description: Requires resource.manage or workspace.admin. Setting isDefault unsets prior default facility.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                timezone: { type: string }
                address: { type: string }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                isDefault: { type: boolean }
      responses:
        '200': { description: Updated facility }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/facilities/grants:
    post:
      summary: Grant or revoke facility access for membership
      description: Requires access.manage or workspace.admin. Controls user multi-site operational boundaries.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, membershipId, facilityId]
              properties:
                action: { type: string, enum: [GRANT, REVOKE] }
                membershipId: { type: string }
                facilityId: { type: string }
      responses:
        '200': { description: Grant or revoke result }
        '201': { description: Created grant }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/notifications:
    get:
      summary: List user notification inbox
      description: Returns durable inbox notifications with unread count and pagination.
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Notifications list and unread count }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Mark notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [MARK_READ, MARK_ALL_READ] }
                notificationId: { type: string }
      responses:
        '200': { description: Success status }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/issue-reasons:
    get:
      summary: List configurable issue and blocker reasons
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [PAUSE, SCRAP, REWORK, BLOCKER] }
      responses:
        '200': { description: Array of issue reasons }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a configurable issue or blocker reason
      description: Requires resource.manage or planning.write.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, code, label]
              properties:
                category: { type: string, enum: [PAUSE, SCRAP, REWORK, BLOCKER] }
                code: { type: string }
                label: { type: string }
                sortOrder: { type: integer, default: 0 }
      responses:
        '201': { description: Created issue reason }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/orders:
    post:
      summary: Create an order draft with one or more item lines
      description: Accepts decimal quantity strings to preserve 10^6 atom precision. Lines are independently tracked for job release.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, orderTypeId, requestedDate]
              properties:
                customerId: { type: string }
                orderTypeId: { type: string }
                itemId: { type: string, description: Legacy single-item compatibility field }
                orderedQuantity: { oneOf: [{ type: string, pattern: '^\\d+(\\.\\d+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                requestedDate: { type: string, format: date-time }
                promisedDate: { type: string, format: date-time, nullable: true }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, orderedQuantity]
                    properties:
                      itemId: { type: string }
                      uomId: { type: string }
                      orderedQuantity: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                      unitPriceCents: { type: integer, minimum: 0 }
                      requestedDate: { type: string, format: date-time }
                      promisedDate: { type: string, format: date-time, nullable: true }
                      notes: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Created order and item lines }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/{id}/lines:
    get:
      summary: List order lines for an order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Array of order lines }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Add an order line dynamically to an order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, orderedQuantity]
              properties:
                itemId: { type: string }
                uomId: { type: string }
                orderedQuantity: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                unitPriceCents: { type: integer, minimum: 0 }
                requestedDate: { type: string, format: date-time }
                promisedDate: { type: string, format: date-time }
                notes: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Created order line }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/{id}/confirm:
    post:
      summary: Confirm an order
      description: Records the authenticated confirmer and timestamp. The authorized release command can also confirm READY orders for integrations that use the single-step release path.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      responses:
        '200': { description: Confirmed order }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/jobs/allocate:
    post:
      summary: Allocate a bounded job (ManufacturingOrder) against an order line
      description: Creates a DRAFT manufacturing order only for an unconfirmed DRAFT order. Optional workflow versions must be published for that order type; optional engineering revisions must be approved and belong to the same order line. Allocation cannot exceed the line's unallocated integer atoms.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderLineId, targetQuantity]
              properties:
                orderLineId: { type: string }
                targetQuantity: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                moNumber: { type: string }
                departmentId: { type: string }
                workflowVersionId: { type: string }
                engineeringRevisionId: { type: string }
      responses:
        '201': { description: Created manufacturing order and allocation remainder }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/{id}/engineering/{revId}:
    get:
      summary: Get an engineering revision for its order
      description: The revision must belong to the order ID in the path and the authenticated workspace.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: revId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Engineering revision with BOM lines }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Save a draft engineering revision
      description: Quantity values accept decimal strings at up to 10^6 atom scale. Allowance is persisted in integer basis points; values finer than 0.01 percent are rejected. Revision must belong to the order in the path.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: revId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                workflowVersionId: { type: string }
                outputBasis: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                bomLines:
                  type: array
                  items:
                    type: object
                    required: [operationNodeKey, itemId, inputUomId, requirementQuantity]
                    properties:
                      operationNodeKey: { type: string }
                      itemId: { type: string }
                      inputUomId: { type: string }
                      requirementQuantity: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                      outputBasis: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                      allowanceBps: { type: integer, minimum: 0, maximum: 10000 }
                      allowancePercent: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, minimum: 0, maximum: 100 }] }
      responses:
        '200': { description: Updated engineering revision and BOM }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orders/{id}/engineering/{revId}/actions:
    post:
      summary: Submit or approve an engineering revision
      description: Revision must belong to the order in the path. Approval remains permission-gated by the service.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: revId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [submit_review, approve] }
                notes: { type: string, maxLength: 500 }
      responses:
        '200': { description: Engineering action result }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/engineering/drawings:
    get:
      summary: List drawing revisions for an item
      parameters:
        - name: itemId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Array of drawing revisions }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Release a new drawing revision (superseding previous released revision)
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, itemId, drawingNumber, revisionCode]
              properties:
                documentId: { type: string }
                itemId: { type: string }
                drawingNumber: { type: string }
                revisionCode: { type: string }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Released drawing revision }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/technicians/{id}/skills:
    post:
      summary: Assess technician skill (0-4 scale)
      parameters:
        - name: id
          in: path
