              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users:
    get:
      summary: List safe membership read models in the current workspace
      description: Requires access.manage. Includes membership version, roles and scope; never credentials.
      responses:
        '200': { description: 'Envelope containing data array of memberships, identityUpdatedAt and canEditIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a new credential account and workspace membership atomically
      description: Requires access.manage. Existing emails return 409 and never reset credentials. Idempotency and audit apply.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccessUser' }
      responses:
        '201': { description: 'Committed envelope with data.userId, data.membershipId, data.name, data.email and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Duplicate email or idempotency payload conflict' }
  /api/users/{id}:
    parameters:
      - { name: id, in: path, required: true, description: Workspace membership ID, schema: { type: string } }
    get:
      summary: Read a workspace membership
      description: Requires access.manage.
      responses:
        '200': { description: 'Envelope containing data membership' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Membership not in current workspace' }
    patch:
      summary: Replace membership role assignments, scope and status
      description: Requires access.manage. Optionally edits name/login email when the actor administers every linked workspace. Passwords are unchanged; changing email revokes target sessions and resets email verification. At least one active ACCESS_ADMIN must remain. Grants affect subsequent requests.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccessMembership' }
      responses:
        '200': { description: 'Committed envelope with data.id, data.status, data.name, data.email, data.reauthenticate and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Membership not in current workspace' }
        '409': { description: 'Stale expectedVersion or idempotency conflict; transaction rolled back' }
  /api/roles:
    get:
      summary: List active and inactive workspace roles
      description: Requires access.manage. Each row includes id, code, name, isSystem, isActive, version, memberCount and permission codes.
      responses:
        '200': { description: 'Envelope containing data array of roles' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a custom workspace role
      description: Requires access.manage. Permission codes must exist in the application catalog.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccessRole' }
      responses:
        '201': { description: 'Committed envelope with data.id and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Duplicate workspace role code or idempotency conflict' }
  /api/roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update a custom role name, permissions and active status
      description: Requires access.manage. System role definitions are immutable. Inactive roles confer no permissions. No destructive delete.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccessRole' }
      responses:
        '200': { description: 'Committed envelope with data.id and meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Role not in current workspace' }
        '409': { description: 'Stale expectedVersion or idempotency conflict' }
  /api/permissions:
    get:
      summary: Read the application permission catalog
      description: Requires access.manage. Permission definitions are read-only and are maintained with application behavior.
      responses:
        '200': { description: 'Envelope containing data array with code, description, resource and action' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/access/scopes:
    get:
      summary: Read customer and technician link options for access administration
      description: Requires access.manage. Returns only current workspace options. Assignments validate scope and technician uniqueness.
      responses:
        '200': { description: 'Envelope containing data.customers and data.technicians with id, code and name' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/resources/skills:
    get:
      summary: List current-workspace skill definitions
      description: Used to select a qualification for technician assessment. Requires an authenticated principal.
      responses:
        '200': { description: 'Envelope containing data array of workspace skill definitions.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a workspace skill definition
      description: Requires resource.manage. Accepted scaleMax input is 1 to 10; the persisted value is capped at 4 to match technician assessment levels.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 50 }
                name: { type: string, maxLength: 100 }
                scaleMax: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        '201': { description: Created skill definition }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Skill code already exists in the workspace }

  /api/execution/tasks/{id}/start:
    post:
      summary: Start execution of an assigned task
      description: Validates operator assignment ownership, checks predecessor completion, transitions task to RUNNING, and records work session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                technicianId: { type: string }
                overrideReason: { type: string }
                notes: { type: string }
      responses:
        '200': { description: Task and active session details }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/execution/tasks/{id}/pause:
    post:
      summary: Pause an in-progress execution task
      description: Closes the active session, sets status to PAUSED, and records duration plus a workspace-configured PAUSE reason. Legacy reason codes are accepted only when they match an active catalog entry.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reasonId: { type: string, description: Active workspace IssueReason ID in category PAUSE. }
                reason: { type: string, default: BREAK, description: Legacy IssueReason code in category PAUSE. }
                notes: { type: string }
      responses:
        '200': { description: Task and paused session details }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/execution/tasks/{id}/resume:
    post:
      summary: Resume a paused execution task
      description: Starts new work session and transitions task back to RUNNING.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        '200': { description: Task and resumed session details }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/execution/tasks/{id}/interval-corrections:
    post:
      summary: Correct a closed work interval
      description: Requires task.assign, planning.write, or workspace.admin. Corrections are idempotent, update task duration atomically, and append an actor-attributed workflow event with the prior value, delta, and reason.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, correctedDurationMinutes, reasonCode, reason]
              properties:
                sessionId: { type: string, minLength: 1 }
                correctedDurationMinutes: { type: integer, minimum: 0, maximum: 10080 }
                reasonCode: { type: string, minLength: 1, maxLength: 100 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Corrected session and immutable audit event reference }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/passports/{serial}:
    get:
      summary: Read an internal passport draft
      description: Published passports return a canonical immutable snapshot after integrity verification. Staff must have permission and an owning facility grant. Customers must own the order and have an explicit active share. Legacy released rows without snapshots remain unavailable. Material quantities are job-batch consumption evidence, not invented per-unit allocations.
      parameters:
        - name: serial
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Authorized immutable passport snapshot or explicitly labeled internal draft preview }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/passports/publish:
    post:
      summary: Publish a unit passport
      description: Creates an immutable v1 snapshot from one real serialized final output, dedicated unit lot, full finalized QC acceptance and the actual job genealogy. Hash covers canonical content; identities cannot be replaced. Initially internal; share explicitly with the owning customer. Requires quality.inspect, delivery.dispatch or admin.access and an owning facility grant.
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serialNumber, itemId]
              properties:
                serialNumber: { type: string }
                orderId: { type: string }
                itemId: { type: string }
                lotId: { type: string }
      responses:
        '201': { description: Published passport identity, serial number and SHA-256 digest }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/passports/{serial}/sharing:
    post:
      summary: Explicitly share or revoke a published passport for the owning customer
      parameters:
        - { name: serial, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [SHARE, REVOKE] }
      responses:
        '200': { description: Audited sharing disposition; snapshot and digest stay immutable }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/delivery/shipments:
    get:
      summary: List workspace-scoped shipment allocations
      description: Requires delivery.read, order.read or owner. Optional filters are applied within the authenticated workspace.
      parameters:
        - in: query
          name: orderId
          schema: { type: string, format: uuid }
        - in: query
          name: customerId
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [ALLOCATED, DISPATCHED, DELIVERED, CANCELLED] }
      responses:
        '200': { description: Shipment list envelope }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Allocate finished goods to an order shipment
      description: Requires delivery.dispatch, order.create or owner. Each multi-item shipment line identifies its orderLineId and matching itemId. Allocation is revalidated transactionally and capped against that exact customer line; ambiguous historical shipment lines block further allocation until reconciled. Stock reservations and shipment lines are created atomically.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, lines]
              properties:
                orderId: { type: string, format: uuid }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, sourceLocationId, allocatedAtoms]
                    properties:
                      orderLineId: { type: string, format: uuid, description: Required for orders with customer order lines; omitted only for legacy orders without order lines }
                      itemId: { type: string, format: uuid }
                      lotId: { type: string, format: uuid }
                      sourceLocationId: { type: string, format: uuid }
                      allocatedAtoms: { type: string, pattern: '^[0-9]+$', description: Positive integer 10^6 atoms }
                carrierName: { type: string, maxLength: 100 }
                trackingNumber: { type: string, maxLength: 100 }
                destinationAddress: { type: string, maxLength: 500 }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Shipment allocation and reservation envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/delivery/shipments/{id}/dispatch:
    post:
      summary: Dispatch an allocated shipment
      description: Posts shipment ledger movements and consumes reservations in one idempotent command.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                carrierName: { type: string, maxLength: 100 }
                trackingNumber: { type: string, maxLength: 100 }
                notes: { type: string, maxLength: 500 }
      responses:
        '200': { description: Dispatched shipment envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/delivery/shipments/{id}/confirm:
    post:
      summary: Confirm proof of delivery
      description: Confirms a dispatched shipment and recalculates the order delivery status from delivered quantities.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proofOfDelivery: { type: string, maxLength: 500 }
                receivedBy: { type: string, maxLength: 100 }
                deliveredAt: { type: string, format: date-time }
                notes: { type: string, maxLength: 500 }
      responses:
        '200': { description: Delivered shipment envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/execution/tasks/{id}/output:
    post:
      summary: Record production output with integer atoms
      description: Authoritatively consumes WIP material demand, caps final output against the matching order item line across the order, records output units, and triggers double-entry stock movement into quarantine/destination location.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outputAtoms, destinationLocationId]
              properties:
                outputAtoms: { type: string, description: Decimal integer 10^6 atoms; keep values as strings to preserve precision beyond JavaScript's safe integer range. }
                destinationLocationId: { type: string }
                lotNumber: { type: string }
                serialNumber: { type: string, description: Required for serial-tracked final output. Exactly one complete unit is recorded in a dedicated lot; duplicate serials and fractional units are rejected. }
                isFinal: { type: boolean, deprecated: true, description: Legacy compatibility field; finality is derived from the released workflow graph and cannot be overridden by clients. }
                notes: { type: string }
      responses:
        '200': { description: Production output and movement envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/inventory/issues:
    post:
      summary: Issue reserved material into production WIP
      description: Revalidates the demand and any referenced reservation in the committing transaction. A reservation must belong to the specified demand and match its item, source location, task, and lot; reservation and stock-balance quantities are never silently clamped.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [demandId, sourceLocationId, wipLocationId, atoms]
              properties:
                demandId: { type: string, format: uuid }
                sourceLocationId: { type: string, format: uuid }
                sourceLotId: { type: string, format: uuid, nullable: true }
                wipLocationId: { type: string, format: uuid }
                atoms: { type: string, pattern: '^[0-9]+$', description: Positive integer atoms; send as a string to preserve exact precision. }
                reservationId: { type: string, format: uuid, nullable: true }
                notes: { type: string }
      responses:
        '201': { description: Issue movement and inventory balance update }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/quality/inspections:
    post:
      summary: Create a production-output or incoming-material QC inspection
      description: Incoming-material inspections must identify one receipt line held in QUARANTINE; the server derives the receipt and full line quantity. One inspection is allowed per receipt line.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceType: { type: string, enum: [PRODUCTION_OUTPUT, GOODS_RECEIPT], default: PRODUCTION_OUTPUT }
                productionOutputId: { type: string, format: uuid }
                supplyReceiptLineId: { type: string, format: uuid, description: Required for GOODS_RECEIPT; must be held in QUARANTINE. }
                supplyReceiptId: { type: string, format: uuid, description: Optional consistency check; derived from the receipt line. }
                qcChecklistId: { type: string, format: uuid }
                inspectedAtoms: { type: string, pattern: '^[0-9]+$', description: For incoming material this must equal the entire receipt-line quantity. }
                notes: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Draft inspection linked to the authorized source record }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/quality/inspections/{id}/finalize:
    post:
      summary: Finalize a quality inspection
      description: Enforces conservation of inspected atoms, rechecks the pinned checklist and required document evidence, validates workspace evidence and destinations transactionally. Production output may be dispositioned to FG/SCRAP. Incoming receipt lines held in QUARANTINE may release passed atoms to RAW (with linked demand reservations) or scrap atoms; material rework remains held and unsupported until an incoming reinspection flow exists.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passedAtoms]
              properties:
                passedAtoms: { type: string, pattern: '^[0-9]+$', description: Integer atoms serialized as a string. }
                reworkAtoms: { type: string, pattern: '^[0-9]+$', default: '0' }
                scrappedAtoms: { type: string, pattern: '^[0-9]+$', default: '0' }
                destinationFgLocationId: { type: string, format: uuid }
                destinationRawLocationId: { type: string, format: uuid, description: Active RAW location for passed incoming receipt material. }
                destinationScrapLocationId: { type: string, format: uuid }
                results:
                  type: array
                  items:
                    type: object
                    required: [checkCode, checkDescription, isPassed]
                    properties:
                      checkCode: { type: string }
                      checkDescription: { type: string }
                      checkMethod: { type: string }
                      measuredValue: { type: string }
                      isPassed: { type: boolean }
                      defectReason: { type: string }
                      notes: { type: string }
                      evidenceDocumentId: { type: string, format: uuid, description: Existing private document uploaded and linked to this inspection. }
                notes: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Finalized inspection with inventory dispositions }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/execution/tasks/{id}/issues:
    get:
      summary: List all issues recorded for a task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Array of TaskIssueDTO }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Record a blocker or issue on a task
      description: Records issue, notifies assigned owner, and transitions task to BLOCKED if severity is HIGH or CRITICAL.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, severity]
              properties:
                issueReasonId: { type: string }
                title: { type: string }
                description: { type: string }
                severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
                ownerUserId: { type: string }
                expectedResolutionAt: { type: string, format: date-time }
                evidenceDocumentIds:
                  type: array
                  maxItems: 10
                  description: Existing internal documents linked to this task; server validates workspace and task linkage before storing authorized download references.
                  items: { type: string }
                affectedMaterialId:
                  type: string
                  description: Item with a material demand in the owning order; validated transactionally.
      responses:
        '200': { description: Created TaskIssueDTO envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/execution/issues/{id}/resolve:
    post:
      summary: Resolve an open task issue
      description: Marks issue RESOLVED and automatically unblocks the parent task if no other blocking issues remain.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes: { type: string }
      responses:
        '200': { description: Resolved TaskIssueDTO envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/execution/issues/{id}/reopen:
    post:
      summary: Reopen a previously resolved task issue
      description: Reopens issue and sets parent task back to BLOCKED if severity is HIGH or CRITICAL.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes: { type: string }
      responses:
        '200': { description: Reopened TaskIssueDTO envelope }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/execution/scan:
    post:
      summary: Lookup task, job, or order by scanned barcode or QR string
      description: |
        Safely parses a barcode/QR token with tenant authorization check.
        Disclosure rules: TASK results are limited to tasks assigned to the
        caller unless the caller holds task.assign/planning.read; ORDER results
        require order.read; JOB results include a deep-link taskId only for
        callers allowed to open tasks (assigned operators and supervisors).
        Callers without any matching entity receive 404 without disclosure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: ScanResultDTO envelope (type TASK|JOB|ORDER, entityId, displayCode, title, status, optional taskId)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/execution/profile:
    get:
      summary: Retrieve current operator profile, verified skills, and certifications
      description: Returns the authenticated technician profile, employee code, facility, verified skills matrix (0-4 scale), and active certifications.
      responses:
        '200':
          description: TechnicianProfileDTO envelope
        '401': { $ref: "#/components/responses/Unauthorized" }

  /api/execution/my-tasks:
    get:
      summary: List tasks assigned to the current operator or all workspace tasks for supervisors
      description: Returns active and scheduled tasks with real-time work session elapsed minutes and predecessor status.
      responses:
        '200':
          description: Array of MyTaskSummaryDTO
        '401': { $ref: "#/components/responses/Unauthorized" }

  /api/facilities:
    get:
      summary: List all facilities in current workspace
      description: Returns operating sites ordered by default status and code.
      responses:
        '200': { description: Array of facilities }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a new operating facility
      description: Requires resource.manage or workspace.admin. Code must be unique within workspace.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                timezone: { type: string, default: Asia/Jakarta }
                address: { type: string }
                isDefault: { type: boolean, default: false }
      responses:
        '201': { description: Created facility }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/facilities/{id}:
    get:
      summary: Get facility details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Facility details }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Facility not found }
    patch:
      summary: Update facility configuration
      description: Requires resource.manage or workspace.admin. Setting isDefault unsets prior default facility.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                timezone: { type: string }
                address: { type: string }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                isDefault: { type: boolean }
      responses:
        '200': { description: Updated facility }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/facilities/grants:
    post:
      summary: Grant or revoke facility access for membership
      description: Requires access.manage or workspace.admin. Controls user multi-site operational boundaries.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, membershipId, facilityId]
              properties:
                action: { type: string, enum: [GRANT, REVOKE] }
                membershipId: { type: string }
                facilityId: { type: string }
      responses:
        '200': { description: Grant or revoke result }
        '201': { description: Created grant }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/notifications:
    get:
      summary: List user notification inbox
      description: Returns durable inbox notifications with unread count and pagination.
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Notifications scoped to the authenticated user, with optional subject links and unread count
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, title, status, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        body: { type: string, nullable: true }
                        status: { type: string, enum: [UNREAD, READ, ARCHIVED] }
                        category: { type: string, enum: [ASSIGNMENT, RELEASE, APPROVAL, BLOCKER, GENERAL] }
                        deliveryStatus: { type: string, enum: [DELIVERED, SUPPRESSED] }
                        deliveryReason: { type: string, nullable: true }
                        subjectType: { type: string, nullable: true }
                        subjectId: { type: string, nullable: true }
                        metadataJson: { type: string, nullable: true }
                        readAt: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time }
                  meta:
                    type: object
                    required: [unreadCount]
                    properties:
                      unreadCount: { type: integer, minimum: 0 }
                      delivery:
                        type: object
                        required: [delivered, suppressed]
                        properties:
                          delivered: { type: integer, minimum: 0 }
                          suppressed: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Mark notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [MARK_READ, MARK_ALL_READ] }
                notificationId: { type: string }
      responses:
        '200': { description: Success status }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/preferences:
    get:
      summary: Read the authenticated user's workspace inbox preferences
      responses:
        '200':
          description: Preferences and membership version
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      preferences: { $ref: '#/components/schemas/NotificationPreferences' }
                      version: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Save inbox preferences for the authenticated membership
      description: Audited command with optimistic membership version and Idempotency-Key replay. Muted future notifications retain a SUPPRESSED delivery disposition and are omitted from inbox and unread counts. Delivery failures abort the business transaction and emit notification.delivery_failed structured logs.
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preferences, expectedVersion]
              properties:
                preferences: { $ref: '#/components/schemas/NotificationPreferences' }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Saved preferences and version with command metadata }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Membership changed or idempotency key reused with a different payload }

  /api/issue-reasons:
    get:
      summary: List configurable issue and blocker reasons
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [PAUSE, SCRAP, REWORK, BLOCKER] }
      responses:
        '200': { description: Array of issue reasons }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a configurable issue or blocker reason
      description: Requires resource.manage or planning.write.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, code, label]
              properties:
                category: { type: string, enum: [PAUSE, SCRAP, REWORK, BLOCKER] }
                code: { type: string }
                label: { type: string }
                sortOrder: { type: integer, default: 0 }
      responses:
        '201': { description: Created issue reason }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/form-instances:
    get:
      summary: List authorized form evidence for one order, task or inspection
      parameters:
        - { name: subjectType, in: query, required: true, schema: { type: string, enum: [ORDER, TASK, INSPECTION] } }
        - { name: subjectId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Authorized form instances with pinned form definitions, snapshotted required/completionPoint values and latest submissions }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/forms:
    get:
      summary: List form templates available in the workspace
      responses:
        '200': { description: Form templates and their version summaries }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a form template with its initial draft version
      description: Requires forms.create. Template and first draft version are created in one audited transaction. Idempotency-Key replays the same result; unknown request properties are rejected.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormTemplateCreate' }
      responses:
        '201': { description: Template and version IDs created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/forms/{id}/versions:
    post:
      summary: Fork a form version into a new draft
      description: Requires forms.create. The source definition and content hash are copied into a new immutable-version lineage. Idempotency-Key replays the same fork result; unknown request properties are rejected.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormVersionFork' }
      responses:
        '201': { description: New draft version created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/form-instances/{id}:
    get:
      summary: Read one form instance and its latest submission
      description: Requires current active workspace membership and subject-specific permission, assignment and facility scope. Caller identity is derived from the authenticated session.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Authorized form instance with its pinned definition, required/completionPoint snapshot and latest submission }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/form-instances/{id}/draft:
    put:
      summary: Save a version-checked form draft
      description: Requires current active membership and subject access. Actor and subject are derived server-side; unknown request properties are rejected. Replays with the same Idempotency-Key and payload return the original command result.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormSubmissionDraft' }
      responses:
        '200': { description: Draft saved; response contains instanceId, submissionId and incremented version }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/form-instances/{id}/finalize:
    post:
      summary: Finalize a version-checked form submission
      description: Requires current active membership and subject access. Actor and subject are derived server-side; unknown request properties are rejected. Finalized answers are immutable; use the correction endpoint for append-only corrections.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormSubmissionDraft' }
      responses:
        '200': { description: Submission finalized; response contains instanceId, submissionId and incremented version }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/form-instances/{id}/corrections:
    post:
      summary: Append a version-checked correction to a finalized submission
      description: Requires current active membership, form-correction permission and subject access. Actor and subject are derived server-side; the required reason and prior finalized submission are preserved in the correction chain.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormSubmissionCorrection' }
      responses:
        '201': { description: Correction appended; response contains instanceId, submissionId and incremented version }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/forms/bindings:
    post:
      summary: Bind a published form version to an order type, draft workflow node or QC checklist
      description: Workflow node bindings can only be added while the target workflow version is DRAFT. Publishing freezes the executable form-binding set for that version.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formVersionId, context]
              properties:
                formVersionId: { type: string, format: uuid }
                context: { type: string, enum: [ORDER_TYPE, WORKFLOW_NODE, QC_CHECKLIST] }
                orderTypeId: { type: string, format: uuid }
                workflowVersionId: { type: string, format: uuid }
                workflowNodeKey: { type: string }
                qcChecklistId: { type: string, format: uuid }
                required: { type: boolean, default: true }
              additionalProperties: false
      responses:
        '201': { description: Form binding created and audited }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/forms/{id}/versions/{versionId}/actions:
    post:
      summary: Advance a form version through review, publication or retirement
      description: Requires the permission for the selected action and the expected current version. Unknown request fields are rejected. For publish actions, Idempotency-Key enables payload-bound replay.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormVersionAction' }
      responses:
        '200': { description: Form version action completed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/forms/{id}/versions/{versionId}:
    patch:
      summary: Update an immutable form version while it remains a draft
      description: Requires forms.edit_draft and expectedVersion. Published, review and retired versions cannot be edited. Unknown request properties are rejected.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormVersionDraftUpdate' }
      responses:
        '200': { description: Draft definition updated and resource version incremented }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/workflows/lifecycle-members:
    get:
      summary: List active members for a lifecycle stage department assignment
      description: Requires workflow.author or workspace.admin. The response is limited to active memberships in the caller's workspace and selected active department, with display names and active role names only; reassignment validates facility and action eligibility again on write.
      parameters:
        - { name: departmentId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Active department membership options for workflow assignment authoring }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/workflows/lifecycle-roles:
    get:
      summary: List safe active role choices for lifecycle stage assignments
      description: Requires workflow.author, workflow.publish, or access.manage. Returns only active roles in the caller's workspace as code, display name, and active state; it does not expose role IDs, membership counts, or permission grants. Stage publication revalidates that every configured role can perform its action.
      responses:
        '200':
          description: Workspace-scoped active lifecycle role choices
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [code, name, isActive]
                      properties:
                        code: { type: string }
                        name: { type: string }
                        isActive: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/order-lifecycle/work-items:
    get:
      summary: List lifecycle stages assigned to the current membership or its eligible department queue
      description: Requires an operational read capability. Personal results include direct membership assignments and department-queue stages whose configured role codes match the caller. Department results include eligible queue work; workflow authors and workspace admins can also review specific-member work in their own department for reassignment. Facility scope is enforced from the authenticated principal; callers cannot choose another department or workspace.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, department], default: mine } }
      responses:
        '200': { description: Bounded lifecycle stage summaries with order, owner department, schedule, predecessor keys, pinned form references, and a caller-specific canReassign capability }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/order-lifecycle/stages/{id}/claim:
    post:
      summary: Claim a ready department-queue lifecycle stage
      description: Claims a stage for the caller's active membership using an expected version. Requires the stage action permission, configured department and eligible role, plus facility scope. A successful claim is audited and only the claimant retains the personal work item.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200': { description: Stage claimed by the authenticated membership }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/order-lifecycle/stages/{id}/complete:
    post:
      summary: Complete an assigned evidence-review lifecycle stage
      description: Completes only REVIEW_EVIDENCE stages after validating the current membership assignment, facility scope, pinned required form evidence, and expected stage version. This action records the lifecycle transition and does not perform production, quality, inventory, or delivery mutations.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200': { description: Evidence-review stage completed and audited }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/order-lifecycle/stages/{id}/reassign:
    post:
      summary: Reassign an active lifecycle stage to an eligible member
      description: Requires workflow author or workspace administration permission, facility scope, an active same-department membership with the lifecycle action permission, and an expected stage version. A reason, reassignment audit event, and transactional in-app notifications to active prior and new assignees are mandatory.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, membershipId, reason]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                membershipId: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 500 }
              additionalProperties: false
      responses:
        '200': { description: Stage reassigned to the active eligible membership }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orders:
    post:
      summary: Create an order draft with one or more item lines
      description: Accepts decimal quantity strings to preserve 10^6 atom precision. Lines are independently tracked for job release.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, orderTypeId, requestedDate]
              properties:
                customerId: { type: string }
                orderTypeId: { type: string }
                workflowVersionId: { type: string, format: uuid, description: Optional explicit published production-routing version compatible with the selected order type. Omitted uses the latest published version for that order type. }
                lifecycleWorkflowVersionId: { type: string, format: uuid, description: Optional published ORDER_LIFECYCLE version. The order and its initial stages are created atomically with this immutable workflow pin. }
                itemId: { type: string, description: Legacy single-item compatibility field }
                orderedQuantity: { oneOf: [{ type: string, pattern: '^\\d+(\\.\\d+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                requestedDate: { type: string, format: date-time }
                promisedDate: { type: string, format: date-time, nullable: true }
                rfqDraftId: { type: string, format: uuid, description: Existing workspace RFQ review; must be reviewed and not already linked to another order. }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, orderedQuantity]
                    properties:
                      itemId: { type: string }
                      uomId: { type: string }
                      orderedQuantity: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                      unitPriceCents: { type: integer, minimum: 0 }
                      requestedDate: { type: string, format: date-time }
                      promisedDate: { type: string, format: date-time, nullable: true }
                      notes: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Created order and item lines }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/{id}/evidence:
    get:
      summary: Read the authorized order evidence timeline
      description: Returns a bounded, read-only projection of lifecycle, engineering, scheduling, form, stock, quality and shipment evidence. Customer principals use the separately scoped passport projection and cannot read this internal timeline. Event categories that the caller cannot read are omitted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Authorized order evidence timeline
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [orderId, orderNumber, events, sampled, appliedSearch]
                    properties:
                      orderId: { type: string }
                      orderNumber: { type: string }
                      sampled: { type: boolean, description: True when one or more source queries reached its read bound or matching events exceeded limit. }
                      appliedSearch: { type: string, nullable: true }
                      events:
                        type: array
                        items:
                          type: object
                          required: [reference, category, title, label, summary, occurredAt, orderId, href, references]
                          properties:
                            reference: { type: string }
                            category: { type: string, enum: [WORKFLOW, ENGINEERING, FORM, SCHEDULING, MATERIAL, PRODUCTION, QUALITY, DELIVERY, PASSPORT] }
                            title: { type: string }
                            label: { type: string }
                            summary: { type: string }
                            occurredAt: { type: string, format: date-time }
                            orderId: { type: string }
                            lineId: { type: string }
                            jobId: { type: string }
                            taskId: { type: string }
                            stageId: { type: string }
                            submissionId: { type: string }
                            lotId: { type: string }
                            shipmentId: { type: string }
                            actorName: { type: string }
                            href: { type: string }
                            references: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orders/{id}/lines:
    get:
      summary: List order lines for an order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Array of order lines }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Add an order line dynamically to an order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, orderedQuantity]
              properties:
                itemId: { type: string }
                uomId: { type: string }
                orderedQuantity: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                unitPriceCents: { type: integer, minimum: 0 }
                requestedDate: { type: string, format: date-time }
                promisedDate: { type: string, format: date-time }
                notes: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Created order line }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/{id}/costing/explanation:
    get:
      summary: Read deterministic, ranked cost variance contributors and evidence links
      description: Requires cost.read. Variance uses integer minor units. Missing standard or actual coverage is returned explicitly; no revenue or margin is inferred.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Authorized variance explanation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [orderId, currency, totalVarianceCents, coverage, unavailableReason, contributors]
                    properties:
                      orderId: { type: string }
                      currency: { type: string, nullable: true }
                      totalVarianceCents: { type: string, nullable: true }
                      coverage: { type: object, required: [standard, actual], properties: { standard: { type: boolean }, actual: { type: boolean } } }
                      unavailableReason: { type: string, nullable: true }
                      contributors:
                        type: array
                        items:
                          type: object
                          required: [category, varianceCents, sourceEntryCount, sourceEntryIds, evidenceHref]
                          properties:
                            category: { type: string, enum: [MATERIAL, LABOR, MACHINE, OUTSOURCED, SCRAP] }
                            varianceCents: { type: string }
                            sourceEntryCount: { type: integer }
                            sourceEntryIds: { type: array, items: { type: string } }
                            evidenceHref: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { description: Mixed currency ledger cannot be compared }

  /api/orders/{id}/costing:
    get:
      summary: Read a workspace-scoped job cost summary and source entries
      description: Requires cost.read. Cost amounts remain integer minor-unit strings. Missing standard/actual categories and variance values are null, not zero. Mixed-currency legacy ledgers are rejected rather than summed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Authorized category summary with source cost-entry evidence
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [orderId, currency, hasEntries, hasStandard, hasActual, categories]
                    properties:
                      orderId: { type: string }
                      currency: { type: string, nullable: true }
                      hasEntries: { type: boolean }
                      hasStandard: { type: boolean }
                      hasActual: { type: boolean }
                      totalStandardCents: { type: string, nullable: true }
                      totalActualCents: { type: string, nullable: true }
                      totalVarianceCents: { type: string, nullable: true }
                      isFavorable: { type: boolean, nullable: true }
                      categories: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { description: Mixed currency ledger cannot be compared }
    post:
      summary: Record a standard or actual job cost entry
      description: Requires cost.manage. amountCents is an integer minor-unit decimal string; taskId, when supplied, must belong to the route order. One order may use only one currency. The write is transactional, audited, and idempotent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [costCategory, costType, amountCents]
              properties:
                taskId: { type: string }
                costCategory: { type: string, enum: [MATERIAL, LABOR, MACHINE, OUTSOURCED, SCRAP] }
                costType: { type: string, enum: [STANDARD, ACTUAL] }
                amountCents: { type: string, pattern: '^\\d+$' }
                currency: { type: string, pattern: '^[A-Za-z]{3}$' }
                notes: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Committed envelope with data source entry and transaction metadata }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Idempotency key reused with a different payload }
  /api/orders/{id}/confirm:
    post:
      summary: Confirm an order
      description: Records the authenticated confirmer and timestamp. The authorized release command can also confirm READY orders for integrations that use the single-step release path.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      responses:
        '200': { description: Confirmed order }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/jobs/allocate:
    post:
      summary: Allocate a bounded job (ManufacturingOrder) against an order line
      description: Creates a DRAFT manufacturing order only for an unconfirmed DRAFT order. Optional workflow versions must be published for that order type; optional engineering revisions must be approved and belong to the same order line. Allocation cannot exceed the line's unallocated integer atoms.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderLineId, targetQuantity]
              properties:
                orderLineId: { type: string }
                targetQuantity: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                moNumber: { type: string }
                departmentId: { type: string }
                workflowVersionId: { type: string }
                engineeringRevisionId: { type: string }
      responses:
        '201': { description: Created manufacturing order and allocation remainder }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/{id}/engineering/{revId}:
    get:
      summary: Get an engineering revision for its order
      description: The revision must belong to the order ID in the path and the authenticated workspace.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: revId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Engineering revision with BOM lines }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Save a draft engineering revision
      description: Quantity values accept decimal strings at up to 10^6 atom scale. Allowance is persisted in integer basis points; values finer than 0.01 percent are rejected. Revision must belong to the order in the path.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: revId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                workflowVersionId: { type: string }
                outputBasis: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                bomLines:
                  type: array
                  items:
                    type: object
                    required: [operationNodeKey, itemId, inputUomId, requirementQuantity]
                    properties:
                      operationNodeKey: { type: string }
                      itemId: { type: string }
                      inputUomId: { type: string }
                      requirementQuantity: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                      outputBasis: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, exclusiveMinimum: 0 }] }
                      allowanceBps: { type: integer, minimum: 0, maximum: 10000 }
                      allowancePercent: { oneOf: [{ type: string, pattern: '^[0-9]+([.][0-9]+)?$' }, { type: number, minimum: 0, maximum: 100 }] }
      responses:
        '200': { description: Updated engineering revision and BOM }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orders/{id}/engineering/{revId}/actions:
    post:
      summary: Submit or approve an engineering revision
      description: Revision must belong to the order in the path. Approval remains permission-gated by the service.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: revId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [submit_review, approve] }
                notes: { type: string, maxLength: 500 }
      responses:
        '200': { description: Engineering action result }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/engineering/intake/extractions:
    post:
      summary: Extract and persist an RFQ source for engineering review
      description: Requires order.create or engineering.write. Accepts bounded pasted text or an authorized stored document. Stored sources are limited to UTF-8 text/plain and text/csv; PDF/image OCR is not connected. Provider quotes are retained only when the exact quote appears in the source and contains the extracted field value; a reviewer must still confirm meaning and context. If the provider is unavailable or its result fails the bounded schema, no review or order draft is persisted. A successful response stores source SHA-256, document identity when present, model/prompt version, original extraction and source-matched quotes.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [text]
                  properties:
                    text: { type: string, minLength: 1, maxLength: 20000 }
                - type: object
                  additionalProperties: false
                  required: [documentId]
                  properties:
                    documentId: { type: string, format: uuid, description: Authorized stored text/plain or text/csv document ID }
      responses:
        '201': { description: Persisted review-needed extraction and workspace master match IDs }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Provider unavailable or extraction schema invalid; no review or order draft persisted }
  /api/engineering/intake/extractions/{id}:
    get:
      summary: Read a workspace-scoped RFQ source and its review state
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Source text, extraction, immutable original, master matches and review metadata }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Save reviewer-edited extraction as reviewed
      description: One-way transition from NEEDS_REVIEW to REVIEWED; stores the reviewer identity/time and preserves the original extraction. It does not create an order or publish engineering data.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [extraction]
              properties:
                extraction: { type: object, description: Bounded reviewed extraction fields; quantity remains a positive integer until a user confirms the item UOM on order creation. }
      responses:
        '200': { description: Audited review command result }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already reviewed or stale record }

  /api/engineering/drawings:
    get:
      summary: List drawing revisions for an item
      parameters:
        - name: itemId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Array of drawing revisions }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Release a new drawing revision (superseding previous released revision)
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, itemId, drawingNumber, revisionCode]
              properties:
                documentId: { type: string }
                itemId: { type: string }
                drawingNumber: { type: string }
                revisionCode: { type: string }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Released drawing revision }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/technicians/{id}/skills:
    post:
      summary: Assess technician skill (0-4 scale)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skillId, level]
              properties:
                skillId: { type: string }
                level: { type: integer, minimum: 0, maximum: 4 }
                assessmentStatus: { type: string, enum: [CLAIMED, OBSERVED, VERIFIED, REVOKED], default: VERIFIED }
                validFrom: { type: string, format: date-time }
                expiresAt: { type: string, format: date-time }
                evidence: { type: string }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Assessed skill record }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Revoke technician skill
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: skillId
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      responses:
        '200': { description: Revoked skill record }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/technicians/{id}/certifications:
    post:
      summary: Assign or renew technician certification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificationId, issuedDate, validUntil]
              properties:
                certificationId: { type: string }
                certificateNumber: { type: string }
                scope: { type: string }
                evidence: { type: string }
                issuedDate: { type: string, format: date }
                validUntil: { type: string, format: date }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Assigned certification record }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Revoke technician certification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: certificationId
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      responses:
        '200': { description: Revoked certification record }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/resources/machines:
    get:
      summary: List workspace machines
      description: Machine read models include nullable hourlyRateCents; null means no verified hourly rate is configured and cost comparisons must remain unavailable.
      responses:
        '200': { description: Envelope containing workspace-scoped machine records }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a machine and optional hourly cost
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, machineClassId]
              properties:
                code: { type: string, minLength: 1, maxLength: 50 }
                name: { type: string, minLength: 1, maxLength: 100 }
                machineClassId: { type: string }
                departmentId: { type: string, nullable: true }
                calendarId: { type: string, nullable: true }
                facilityId: { type: string, nullable: true }
                status: { type: string, enum: [AVAILABLE, MAINTENANCE, OFFLINE], default: AVAILABLE }
                hourlyRateCents: { type: integer, minimum: 0, nullable: true, description: Integer cents per operating hour; null means unknown, not zero cost. }
                recoveryPriority: { type: integer, minimum: 0, maximum: 10000, default: 100, description: Lower values break ties between equally available capable machines; they never override capability or availability. }
      responses:
        '201': { description: Created machine }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Duplicate machine code or idempotency payload conflict }

  /api/resources/catalog/{resource}/{id}:
    patch:
      summary: Update a versioned workspace catalog record
      description: For resource=machines, hourlyRateCents is an optional non-negative integer in cents per machine hour; null preserves an explicitly unknown rate.
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string, enum: [departments, calendars, machines, technicians, skills, certifications, uoms, qc-checklists] } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                name: { type: string }
                status: { type: string, enum: [AVAILABLE, MAINTENANCE, OFFLINE] }
                hourlyRateCents: { type: integer, minimum: 0, nullable: true }
                recoveryPriority: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        '200': { description: Updated catalog record }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/machines/{id}/downtimes:
    get:
      summary: List machine downtimes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Array of machine downtimes }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Schedule machine downtime
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, startAt, endAt]
              properties:
                reason: { type: string }
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Created machine downtime }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/shifts/templates:
    get:
      summary: List shift templates
      parameters:
        - name: facilityId
          in: query
          schema: { type: string }
      responses:
        '200': { description: Array of shift templates }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create shift template
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, startTime, endTime]
              properties:
                facilityId: { type: string }
                code: { type: string }
                name: { type: string }
                startTime: { type: string, example: "08:00" }
                endTime: { type: string, example: "16:30" }
                breakMinutes: { type: integer, default: 60 }
                isOvernight: { type: boolean, default: false }
      responses:
        '201': { description: Created shift template }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/resources/technicians/{id}/profile:
    get:
      summary: Read workforce profile, qualifications, calendar, bounded roster, confirmed bookings and open assigned tasks
      description: Requires access.manage, resource.manage or planning.read; enforces workspace and technician facility grants. Work records also respect order facility scope. Up to 100 records per section with truncated flag. Dates bound roster/bookings, while open assigned tasks are separately labeled.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: startAt, in: query, schema: { type: string, format: date-time } }
        - { name: endAt, in: query, schema: { type: string, format: date-time }, description: 'Later than startAt, at most 93 days apart. Defaults to 14 days.' }
      responses:
        '200': { description: 'data contains technician, membership account summary, range, roster, bookings, tasks and truncated.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Technician not found in workspace }
  /api/roster/intervals/{id}:
    delete:
      summary: Cancel technician availability without deleting history
      description: Requires resource.manage or planning.write and granted facility. Refuses cancellation of working availability overlapping confirmed bookings. Transactional, versioned and idempotent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Cancelled roster interval }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Stale version }
  /api/resources/certifications:
    get:
      summary: List active certification definitions for authorized workforce managers
      responses:
        '200': { description: Certification definitions in data }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a certification definition with resource.manage
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 50 }
                name: { type: string, maxLength: 100 }
                issuer: { type: string, nullable: true, maxLength: 100 }
      responses:
        '201': { description: 'Created definition; edit/archive use existing resources/catalog/certifications/{id} commands' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/roster/shift-swaps:
    get:
      summary: List a technician's shift swaps and optionally candidate shifts
      description: Requires live resource.manage or planning.write. Workspace and facility grants apply. Latest 50 requests; up to 200 candidate published shifts within 31 days, same effective facility.
      parameters:
        - { name: technicianId, in: query, required: true, schema: { type: string } }
        - { name: sourceId, in: query, schema: { type: string } }
      responses:
        '200': { description: 'data contains requests, candidates and truncated.' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Request a versioned shift swap without changing the schedule
      description: Manager workflow. Stores exact shift, technician and contained confirmed-booking snapshot. Only future published SHIFT intervals for different active technicians in one facility. Running or partially contained work is rejected.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourceRosterId, targetRosterId, sourceVersion, targetVersion, reason]
              properties:
                sourceRosterId: { type: string, format: uuid }
                targetRosterId: { type: string, format: uuid }
                sourceVersion: { type: integer, minimum: 1 }
                targetVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201': { description: Pending request; no shifts or work moved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Stale shift or existing pending swap }
  /api/roster/shift-swaps/{id}:
    patch:
      summary: Approve and atomically swap shifts/work, or reject without changes
      description: Uses live roster-management grants. Approval rejects stale snapshots and revalidates incoming availability, qualifications, facility scope and conservative gross UTC weekly working limits. Transfers contained technician task assignments/bookings, leaves machine bookings and physical inventory unchanged, appends workflow/audit history and in-app notifications. Any failure rolls back every write. Self-approval by a roster manager is allowed; no employee self-service consent or supervisor hierarchy is implied.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, decision]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                decision: { type: string, enum: [APPROVE, REJECT] }
                note: { type: string, maxLength: 500, description: 'At least 3 characters required for rejection.' }
      responses:
        '200': { description: 'data contains id, status, version and movedTasks.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Already decided, stale version or snapshot }

  /api/roster/intervals:
    get:
      summary: List roster intervals
      parameters:
        - name: technicianId
          in: query
          schema: { type: string }
        - name: machineId
          in: query
          schema: { type: string }
        - name: facilityId
          in: query
          schema: { type: string }
        - name: startAt
          in: query
          schema: { type: string, format: date-time }
        - name: endAt
          in: query
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200': { description: Array of roster intervals }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Publish batch of roster intervals
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intervals]
              properties:
                intervals:
                  type: array
                  items:
                    type: object
                    required: [startAt, endAt]
                    properties:
                      facilityId: { type: string }
                      technicianId: { type: string }
                      machineId: { type: string }
                      shiftTemplateId: { type: string }
                      intervalType: { type: string, enum: [SHIFT, OVERTIME, TRAINING, LEAVE, MAINTENANCE, HOLIDAY], default: SHIFT }
                      startAt: { type: string, format: date-time }
                      endAt: { type: string, format: date-time }
                      breakIntervals:
                        type: array
                        items:
                          type: object
                          required: [start, end]
                          properties:
                            start: { type: string }
                            end: { type: string }
                      notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Published roster intervals }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/planning/availability:
    get:
      summary: Query authoritative available working intervals
      parameters:
        - name: resourceType
          in: query
          required: true
          schema: { type: string, enum: [TECHNICIAN, MACHINE] }
        - name: resourceId
          in: query
          required: true
          schema: { type: string }
        - name: startAt
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: endAt
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Continuous working intervals after break, leave, and booking subtraction }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Verify technician eligibility, assessment status, and non-waivable certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [technicianId, slotStart, slotEnd]
              properties:
                technicianId: { type: string }
                minSkillLevels:
                  type: array
                  items:
                    type: object
                    required: [skillId, minLevel]
                    properties:
                      skillId: { type: string }
                      minLevel: { type: integer, minimum: 0, maximum: 4 }
                requiredCertifications:
                  type: array
                  items:
                    type: object
                    required: [certificationId]
                    properties:
                      certificationId: { type: string }
                      scope: { type: string }
                requiredFacilityId: { type: string }
                slotStart: { type: string, format: date-time }
                slotEnd: { type: string, format: date-time }
      responses:
        '200': { description: Eligibility verdict and violation details }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/planning/published-schedules:
    get:
      summary: Retrieve published master schedule revisions
      description: Returns all published schedule revisions in descending order. Requires planning.read or order.read.
      responses:
        '200':
          description: Array of PublishedSchedule records
        '401': { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Publish an authoritative master schedule snapshot
      description: Takes an authoritative snapshot of confirmed bookings for the period, superseding earlier revisions.
      parameters:
        - $ref: "#/components/parameters/AccessIdempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, periodStart, periodEnd]
              properties:
                title: { type: string }
                periodStart: { type: string, format: date-time }
                periodEnd: { type: string, format: date-time }
      responses:
        '201':
          description: Created PublishedSchedule envelope
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }

  /api/technicians/reassessment-queue:
    get:
      summary: Retrieve qualification expiry and reassessment queue
      description: Returns upcoming skill and certification expiries, unverified skills, and revocations for workforce compliance.
      parameters:
        - in: query
          name: daysAhead
          schema: { type: integer, default: 30 }
        - in: query
          name: facilityId
          schema: { type: string }
        - in: query
          name: technicianId
          schema: { type: string }
      responses:
        '200':
          description: List of reassessment queue items
        '401': { $ref: "#/components/responses/Unauthorized" }

  /api/planning/overtime/request:
    post:
      summary: Request technician overtime interval
      description: Submits a draft overtime request routed to the technician membership's active direct supervisor. Workspace-configurable limits default to 240 minutes per local day and 1,200 minutes per local Monday-through-Sunday week; existing draft and published overtime counts toward the limits.
      parameters:
        - $ref: "#/components/parameters/AccessIdempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [technicianId, startAt, endAt, reason]
              properties:
                technicianId: { type: string }
                facilityId: { type: string }
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
                reason: { type: string }
                notes: { type: string }
      responses:
        '201':
          description: Created draft overtime interval
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /api/planning/overtime/{id}/approve:
    post:
      summary: Approve requested technician overtime
      description: Only the direct supervisor membership captured when requested can approve. Rechecks workspace daily and weekly limits in the approval transaction, then promotes the interval to PUBLISHED for production scheduling.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/AccessIdempotency"
      responses:
        '200':
          description: Approved published overtime interval
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /api/planning/overtime/approvals:
    get:
      summary: List overtime requests assigned to the authenticated supervisor
      description: Returns active DRAFT overtime intervals whose captured approver membership is the current principal membership.
      responses:
        '200': { description: Pending overtime approval entries with technician and interval evidence }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/settings/workforce-policy:
    get:
      summary: Read workspace overtime limits
      responses:
        '200': { description: Workspace revision, timezone, daily and weekly overtime limits in hours }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Update workspace overtime limits
      description: Requires resource.manage, workspace.admin or owner; revisions and idempotency are checked transactionally. Limits are integer hours per local day and local Monday-through-Sunday week.
      parameters:
        - $ref: '#/components/parameters/AccessIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, maxOvertimeHoursPerDay, maxOvertimeHoursPerWeek]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                maxOvertimeHoursPerDay: { type: integer, minimum: 0, maximum: 24 }
                maxOvertimeHoursPerWeek: { type: integer, minimum: 0, maximum: 168 }
      responses:
        '200': { description: Updated overtime policy and workspace revision }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Workspace policy changed since it was read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/documents/upload:
    post:
      summary: Upload and link a private document
      description: Document links are workspace-scoped. Linking to an order requires that order to exist in the workspace; setting customerVisible true additionally requires order.release. Task evidence remains internal.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                description: { type: string }
                parentType: { type: string, enum: [ORDER, TASK, INSPECTION, SHIPMENT, PASSPORT] }
                parentId: { type: string, format: uuid }
                customerVisible: { type: boolean, default: false }
      responses:
        '201': { description: Uploaded document with private link metadata }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/portal/orders:
    get:
      summary: List customer-visible orders and per-line progress
      description: Requires customer_order.read_own, order.read or admin.access. The response envelope contains separate quality and delivery quantities for each order line; quantities from different items are never combined into an order-level atom total.
      responses:
        '200': { description: Customer order list envelope with per-order lines array }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }

  /api/portal/orders/{id}:
    get:
      summary: Read customer-visible order detail and verified milestones
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Customer order detail envelope; quality, allocated, dispatched and delivered quantities are reported per order line }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }

  /api/portal/orders/{id}/acknowledge:
    post:
      summary: Acknowledge a customer-visible delivery promise
      description: Requires customer_order.acknowledge_own or admin.access and persists an audited command receipt.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/AccessIdempotency"
      responses:
        '200': { description: Updated customer order detail envelope }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }

  /api/portal/orders/{id}/drawing-approval:
    post:
      summary: Formal customer approval for released engineering drawing revision
      description: Audited customer approval for released drawing associated with order.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/AccessIdempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drawingRevisionId]
              properties:
                drawingRevisionId: { type: string }
                notes: { type: string }
      responses:
        '200':
          description: Audited approval confirmation
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /api/portal/change-requests:
    get:
      summary: List customer order change requests
      parameters:
        - in: query
          name: orderId
          schema: { type: string }
      responses:
        '200':
          description: List of change requests
    post:
      summary: Submit customer order change request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, changeType, reason, requestedChanges]
              properties:
                orderId: { type: string }
                changeType: { type: string, enum: [QUANTITY, DATE, SPECIFICATION, CANCEL] }
                reason: { type: string }
                requestedChanges: { type: object }
      responses:
        '201':
          description: Submitted change request
        '400': { $ref: "#/components/responses/BadRequest" }

  /api/portal/change-requests/{id}/approve:
    post:
      summary: Customer approval of proposed change request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/AccessIdempotency"
      responses:
        '200':
          description: Approved change request
        '400': { $ref: "#/components/responses/BadRequest" }
        '404': { $ref: "#/components/responses/NotFound" }

  /api/supply-orders/{id}/allocations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List matching open material demands and current allocations for a supply order
      description: Workspace and facility scoped. Available quantity excludes independent stock reservations and allocations committed to other supply orders.
      responses:
        '200': { description: Allocation context including PO lines and matching demand candidates }
        '403': { description: Principal lacks supply or planning access }
    put:
      summary: Set explicit supply-order-line to material-demand allocations
      description: Transactional and idempotent. Each pair is unique, item IDs must match, PO quantity and unreserved demand limits are enforced, and received/reserved allocations cannot be reduced.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allocations]
              additionalProperties: false
              properties:
                allocations:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [supplyOrderLineId, demandId, allocatedAtoms]
                    additionalProperties: false
                    properties:
                      supplyOrderLineId: { type: string, format: uuid }
                      demandId: { type: string, format: uuid }
                      allocatedAtoms: { type: string, pattern: '^\d+$', description: Positive integer quantity in storage atoms. }
      responses:
        '200': { description: Persisted allocation rows with received and reserved counters }
        '400': { description: Allocation violates demand, item, or PO quantity constraints }
        '409': { description: Supply-order version changed during allocation }
        '403': { description: Principal lacks supply or planning access }
  /api/inventory/receipts:
    post:
      summary: Receive an approved supplier order and link received quantity to allocated demands
      description: Posts a ledger movement and receipt in one command. For each allocated demand split, a receipt into RAW storage also creates an active stock reservation atomically; QUARANTINE receipts remain unreserved and are not production-ready.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplyOrderId, lines]
              additionalProperties: false
              properties:
                supplyOrderId: { type: string, format: uuid }
                receiptNumber: { type: string }
                receivedDate: { type: string, format: date-time }
                notes: { type: string }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [supplyOrderLineId, locationId, receivedAtoms]
                    additionalProperties: false
                    properties:
                      supplyOrderLineId: { type: string, format: uuid }
                      locationId: { type: string, format: uuid }
                      receivedAtoms: { type: string, pattern: '^\d+$' }
                      lotNumber: { type: string }
                      supplierLotNumber: { type: string }
                      expirationDate: { type: string, format: date-time }
                      notes: { type: string }
                      demandAllocations:
                        type: array
                        maxItems: 200
                        items:
                          type: object
                          required: [demandId, receivedAtoms]
                          additionalProperties: false
                          properties:
                            demandId: { type: string, format: uuid }
                            receivedAtoms: { type: string, pattern: '^\d+$', description: Positive integer quantity assigned from this receipt line to the pre-existing demand allocation. }
      responses:
        '200': { description: Posted receipt including demand links and active reservation IDs when received into RAW }
        '400': { description: Over-receipt, invalid demand split, or unavailable reservation balance }
        '403': { description: Principal lacks inventory receive permission }

components:
  parameters:
    AccessIdempotency:
      name: idempotency-key
      in: header
      description: Stable key per mutation attempt; replay returns the original result. A different payload with the same key conflicts.
      schema: { type: string }
  responses:
    NotFound:
      description: Requested resource was not found in the authorized workspace scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission or ownership policy denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Malformed or invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource version changed or command idempotency key conflicts with a prior payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LifecycleBranchCondition:
      description: Typed activation rule. Legacy form conditions without kind remain accepted as FORM_ANSWER for published workflow compatibility.
      oneOf:
        - type: object
          required: [kind, sourceStageKey, formVersionId, fieldKey, operator, value]
          properties:
            kind: { type: string, enum: [FORM_ANSWER] }
            sourceStageKey: { type: string, minLength: 1, maxLength: 50 }
            formVersionId: { type: string, minLength: 1 }
            fieldKey: { type: string, minLength: 1, maxLength: 100 }
            operator: { type: string, enum: [EQUALS, NOT_EQUALS, IN] }
            value: { oneOf: [{ type: string }, { type: array, minItems: 1, items: { type: string } }] }
        - type: object
          required: [kind, sourceStageKey, operator, value]
          properties:
            kind: { type: string, enum: [QC_OUTCOME] }
            sourceStageKey: { type: string, minLength: 1, maxLength: 50 }
            operator: { type: string, enum: [EQUALS, IN] }
            value:
              oneOf:
                - { type: string, enum: [PASSED, PASSED_AFTER_REWORK, PARTIAL, REJECTED] }
                - type: array
                  minItems: 1
                  items: { type: string, enum: [PASSED, PASSED_AFTER_REWORK, PARTIAL, REJECTED] }
        - type: object
          required: [sourceStageKey, formVersionId, fieldKey, operator, value]
          not: { required: [kind] }
          properties:
            sourceStageKey: { type: string, minLength: 1, maxLength: 50 }
            formVersionId: { type: string, minLength: 1 }
            fieldKey: { type: string, minLength: 1, maxLength: 100 }
            operator: { type: string, enum: [EQUALS, NOT_EQUALS, IN] }
            value: { oneOf: [{ type: string }, { type: array, minItems: 1, items: { type: string } }] }
    FormSubmissionDraft:
      type: object
      required: [expectedVersion, answers]
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        answers: { type: object, additionalProperties: true }
    FormSubmissionCorrection:
      type: object
      required: [expectedVersion, reason, answers]
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        answers: { type: object, additionalProperties: true }
    FormVersionAction:
      type: object
      required: [action, expectedVersion]
      additionalProperties: false
      properties:
        action: { type: string, enum: [submit_review, publish, retire] }
        expectedVersion: { type: integer, minimum: 1 }
    FormVersionDraftUpdate:
      type: object
      required: [expectedVersion, definition]
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        definition: { type: object, description: Validated FormDefinition for ORDER_SPEC, TASK_EVIDENCE or QC_EVIDENCE }
    FormTemplateCreate:
      type: object
      required: [code, name, purpose]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 160 }
        purpose: { type: string, enum: [ORDER_SPEC, TASK_EVIDENCE, QC_EVIDENCE] }
        description: { type: string, maxLength: 2000 }
    FormVersionFork:
      type: object
      required: [fromVersionId]
      additionalProperties: false
      properties:
        fromVersionId: { type: string, format: uuid }
    NotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        ASSIGNMENT: { type: boolean, default: true }
        RELEASE: { type: boolean, default: true }
        APPROVAL: { type: boolean, default: true }
        BLOCKER: { type: boolean, default: true }
        GENERAL: { type: boolean, default: true }
    AssignTask:
      type: object
      required: [taskId, expectedVersion]
      properties:
        taskId: { type: string, minLength: 1 }
        expectedVersion: { type: integer, minimum: 1 }
        technicianId: { type: string, nullable: true }
        machineId: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        notes: { type: string, maxLength: 500 }
    AccessScope:
      type: object
      required: [roleCodes]
      properties:
        roleCodes:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        customerId: { type: string, nullable: true, description: 'Required for CUSTOMER; only CUSTOMER role may be assigned to a customer-scoped membership.' }
        technicianId: { type: string, nullable: true, description: 'Required for TECHNICIAN unless newTechnician is supplied; must be active, within granted facilities and not already linked. Mutually exclusive with customer scope and newTechnician.' }
        departmentId: { type: string, nullable: true, description: 'Organizational department in the same workspace. Does not grant or imply department data isolation.' }
        jobTitle: { type: string, nullable: true, maxLength: 120, description: 'Optional organizational title for approval routing and display.' }
        supervisorMembershipId: { type: string, nullable: true, description: 'Active direct supervisor membership in the same workspace. Reporting chains cannot contain cycles.' }
        facilityId: { type: string, nullable: true, description: 'Primary facility, restricted to the administering principal granted active facilities. Omit to retain current/default. Additional existing grants remain separate.' }
        landingPage: { type: string, nullable: true, description: 'Preferred workspace menu path; must be visible for combined selected active roles. Null uses persona default. Rechecked at login against current grants.' }
        newTechnician:
          type: object
          required: [code]
          additionalProperties: false
          description: 'Atomically creates and links a technician using the account name, organizational department and selected facility. Requires TECHNICIAN role.'
          properties:
            code: { type: string, minLength: 1, maxLength: 50 }
            calendarId: { type: string, nullable: true }

    CreateAccessUser:
      allOf:
        - { $ref: '#/components/schemas/AccessScope' }
        - type: object
          required: [name, email, password]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            email: { type: string, format: email }
            password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    UpdateAccessMembership:
      allOf:
        - { $ref: '#/components/schemas/AccessScope' }
        - type: object
          required: [status, expectedVersion]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            email: { type: string, format: email }
            expectedIdentityUpdatedAt: { type: string, format: date-time, description: 'Required when name or email is supplied; use identityUpdatedAt from the membership read model.' }
            status: { type: string, enum: [ACTIVE, DISABLED] }
            expectedVersion: { type: integer, minimum: 1 }
    CreateAccessRole:
      type: object
      required: [code, name, permissions]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,49}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        permissions:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
    UpdateAccessRole:
      type: object
      required: [name, permissions, isActive, expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        permissions:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        isActive: { type: boolean }
        expectedVersion: { type: integer, minimum: 1 }
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: string
        requestId:
          type: string
        retryable:
          type: boolean
    PrincipalResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [userId, email, name, workspaceId, workspaceName, membershipId, permissions]
          properties:
            userId:
              type: string
            email:
              type: string
            name:
              type: string
            workspaceId:
              type: string
            workspaceName:
              type: string
            membershipId:
              type: string
            permissions:
              type: array
              items:
                type: string
            customerId:
              type: string
              nullable: true
            technicianId:
              type: string
              nullable: true
            roles:
              type: array
              items:
                type: string
    MembershipItem:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          type: string
        roles:
          type: array
          items:
            type: string
        customerId:
          type: string
          nullable: true
        technicianId:
          type: string
          nullable: true
  /machines/telemetry:
    post:
      tags: [telemetry]
      summary: Ingest machine telemetry events (INT-05)
      description: >
        Authenticated machine telemetry ingestion. Events are identified by
        (workspace, machine, eventKey); replays of an already-ingested eventKey
        are counted as duplicates and change nothing. Events whose occurredAt
        precedes the latest received occurrence are flagged
        needsReconciliation for manual review. Telemetry never actuates
        industrial equipment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machineId, events]
              properties:
                machineId:
                  type: string
                  format: uuid
                events:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [eventKey, state, occurredAt]
                    properties:
                      eventKey:
                        type: string
                        maxLength: 200
                      state:
                        type: string
                        enum: [RUNNING, IDLE, DOWN, MAINTENANCE]
                      occurredAt:
                        type: string
                        format: date-time
                      payloadJson:
                        type: string
      responses:
        '200':
          description: Ingestion receipt with accepted/duplicate counts
        '403':
          description: Missing resource.manage permission
        '404':
          description: Machine not found in the authorized scope
  /machines/telemetry/query:
    get:
      tags: [telemetry]
      summary: List telemetry events or derived downtime intervals
      parameters:
        - { name: machineId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: view, in: query, schema: { type: string, enum: [events, downtime], default: events } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Event list, or downtime intervals derived from state transitions (open interval has null endAt)
  /machines/telemetry/reconcile:
    post:
      tags: [telemetry]
      summary: Resolve a late-clock flagged telemetry event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, note]
              properties:
                eventId: { type: string, format: uuid }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Reconciled event with note and actor recorded
        '400':
          description: Event does not require reconciliation
  /api/sharing/consents:
    get:
      summary: List cross-factory sharing consents visible to the workspace
      tags: [Sharing]
      responses:
        '200': { description: Consent list }
    post:
      summary: Propose a sharing consent to a partner workspace (admin)
      tags: [Sharing]
      responses:
        '201': { description: Consent proposed }
  /api/sharing/consents/transition:
    post:
      summary: Accept (partner only) or revoke (either side) a sharing consent
      tags: [Sharing]
      responses:
        '200': { description: Updated consent }
  /api/sharing/commitments:
    post:
      summary: Offer a capacity/stock commitment under an accepted consent (auditable offer only; never moves inventory)
      tags: [Sharing]
      responses:
        '201': { description: Commitment offered }
