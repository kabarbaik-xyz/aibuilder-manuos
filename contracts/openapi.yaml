        '403': { description: Required inventory permission missing }
  /api/ai/brain-qa:
    get:
      summary: Restore the current member's last 20 assistant exchanges
      description: Authenticated personal history, isolated by workspace and membership. Entries with a different current permission, role, facility, customer or technician scope are hidden. Answers are historical snapshots, not live operational state.
      responses:
        '200':
          description: Data array of up to 20 saved questions and answers in chronological order
        '401':
          description: Valid authentication session required
        '403':
          description: Assistant read permission required
    post:
      summary: Factory operational Q&A with personal history
      description: Saves the completed question and answer to personal workspace history; returns only after persistence. Retains the last 20 exchanges in the history projection. Operational records are never modified by chat. Accepts an optional server-resolved ORDER, ITEM or TASK context. Task records are visible only to planning-authorized users or the technician assigned to that task. Context is authorization-checked and limits the grounded workspace snapshot; record IDs alone never grant access. Verified evidence references are converted to typed internal record links by the server; model-provided URLs are never used as navigation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 2000
                context:
                  type: object
                  additionalProperties: false
                  required: [type, id]
                  properties:
                    type: { type: string, enum: [ORDER, ITEM, TASK] }
                    id: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Envelope containing a grounded data response and SUCCESS/FALLBACK explanation
          content:
            application/json:
              schema:
                type: object
                required: [data, explanation]
                properties:
                  data:
                    type: object
                    nullable: true
                    properties:
                      answer:
                        type: string
                      evidenceRefs:
                        type: array
                        items:
                          type: string
                      evidence:
                        type: array
                        items:
                          type: object
                          required: [recordType, recordId, label, href, reference]
                          properties:
                            recordType: { type: string, enum: [ORDER, ITEM, TASK] }
                            recordId: { type: string }
                            label: { type: string }
                            href: { type: string }
                            reference: { type: string }
                      linkToScreen:
                        type: string
                  explanation:
                    type: object
                    description: Explanation with status SUCCESS or FALLBACK, contextHash, verified evidenceRefs for SUCCESS, and reason/fallbackData for FALLBACK.
                    properties:
                      status: { type: string, enum: [SUCCESS, FALLBACK] }
                      contextHash: { type: string }
                      evidenceRefs: { type: array, items: { type: string } }
                      reason: { type: string, enum: [UNAVAILABLE, SCHEMA_ERROR, UNGROUNDED_CLAIM, TIMEOUT] }
                      message: { type: string }

