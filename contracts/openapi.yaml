          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AccessIdempotency'
      responses:
        '200': { description: Revoked skill record }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/technicians/{id}/certifications:
    post:
      summary: Assign or renew technician certification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
